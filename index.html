{id:"q1",d:"Medium",cat:"Bandwagon",type:"fill",q:"“Everyone is buying it, so it must be good” is an example of the ______ technique.",o:[],a:0,x:"Bandwagon",p:10},
{id:"q2",d:"Hard",cat:"Bias",type:"tf",q:"TRUE OR FALSE: A statement can contain both factual information and opinion at the same time.",o:["TRUE", "FALSE"],a:0,x:"A sentence can contain a verifiable fact plus a judgement or interpretation.",p:15},
{id:"q3",d:"Easy",cat:"Ethos",type:"mc",q:"As a speaker with 20 years of experience, I recommend this policy. Which appeal is strongest?",o:["Logos", "Ethos", "Pathos", "Satire"],a:1,x:"The speaker relies on experience and credibility.",p:5},
{id:"q4",d:"Extreme",cat:"Framing",type:"written",q:"Two reports describe the same protest differently. Explain how the order of information could change the audience’s interpretation.",o:[],a:0,x:"Foregrounding different details can make the same event seem more peaceful, threatening, justified, or disorderly.",p:25},
{id:"q5",d:"Easy",cat:"Source Evaluation",type:"tf",q:"TRUE OR FALSE: If a photograph is real, the claim made alongside it must also be reliable.",o:["TRUE", "FALSE"],a:1,x:"A real image can still be presented with a false, outdated, incomplete, or misleading claim.",p:5},
{id:"q6",d:"Hard",cat:"Bias",type:"fill",q:"When a writer deliberately leaves out relevant information that could change how an audience sees an issue, this is called ______.",o:[],a:0,x:"Omission",p:15},
{id:"q7",d:"Medium",cat:"Appeals",type:"mc",q:"“The river rose 40 cm, and families now need safe shelter.” Which two appeals are combined?",o:["Ethos + Logos", "Pathos + Ethos", "Logos + Pathos", "Satire + Logos"],a:2,x:"The measurement provides evidence while the effect on families creates emotion.",p:10},

{id:"q12",d:"Medium",cat:"Perspective",type:"tf",q:"TRUE OR FALSE: If two people describe the same event differently, at least one of them must be lying.",o:["TRUE", "FALSE"],a:1,x:"Different perspectives can produce different descriptions without either person lying.",p:10},
{id:"q13",d:"Extreme",cat:"Statistics",type:"written",q:"A headline says crime “doubled,” but the numbers changed from 1 incident to 2 incidents. Explain why the headline may be misleading even if mathematically correct.",o:[],a:0,x:"The percentage increase is real, but the tiny numbers and missing context can make the change sound much larger than its practical scale.",p:25},

{id:"q16",d:"Medium",cat:"Framing",type:"mc",q:"A school announcement calls a new rule “an exciting opportunity,” while students call it “another burden.” What is most clearly different?",o:["Perspective and framing", "The underlying event must be different", "The students must be biased", "The announcement must be false"],a:0,x:"The same change is being framed through different perspectives and word choices.",p:10},
{id:"q17",d:"Extreme",cat:"Allegory",type:"fill",q:"When a concrete object, character, or event represents a larger abstract idea throughout a work, it can function as an ______.",o:[],a:0,x:"Allegory",p:25},
{id:"q18",d:"Hard",cat:"Evidence",type:"written",q:"Why is one dramatic example usually insufficient to prove that an entire policy “always fails”?",o:[],a:0,x:"One example may not represent the whole population or range of cases; broader evidence is needed for an absolute claim.",p:15},
{id:"q19",d:"Easy",cat:"Repetition",type:"tf",q:"TRUE OR FALSE: Repeating a claim many times automatically makes the claim stronger evidence.",o:["TRUE", "FALSE"],a:1,x:"Repetition can increase familiarity or emphasis, but it does not create new evidence.",p:5},
{id:"q20",d:"Medium",cat:"Satire",type:"fill",q:"Using humour, exaggeration, or absurdity to criticize a real issue is called ______.",o:[],a:0,x:"Satire",p:10},

{id:"q23",d:"Medium",cat:"Ethos",type:"written",q:"Explain the difference between ethos and simply saying “I am an expert.”",o:[],a:0,x:"Ethos is credibility established through relevant expertise, evidence, conduct, reputation, or trustworthiness; merely claiming expertise does not prove it.",p:10},

{id:"q26",d:"Extreme",cat:"Statistics",type:"tf",q:"TRUE OR FALSE: Two statistics can both be accurate but still be inappropriate to compare directly if their samples or question wording are substantially different.",o:["TRUE", "FALSE"],a:1,x:"Different samples or wording can make direct comparison unreliable or misleading.",p:25},

 function blankState(){return {screen:"opening",names:Array(15).fill(""),teams:[],assignment:[],assignmentTeams:[],assignIndex:0,namingIndex:0,lockedGroups:[],lockDraft:[],lockEdit:null,phase:0,round:1,currentTeam:0,used:[],deck:[],currentQuestion:null,currentCard:null,answer:null,result:null,writtenResponse:"",timeExpired:false,phase1AbilityMode:null,phase1Target:null,phase1Extra:false,history:[],multiplier:100,newsIndex:0,news:null,p2AbilityMode:null,p2Target:null,p2Pending:null,p2TurnSpent:false,p2TurnComplete:false,turnTransition:false,exhaustionTeam:null,narrativeDone:false,narrativeAnswers:[],narrativeIndex:0,finalReward:0,bombUsed:false,victoryTeam:null,victoryBeat:0,settings:{sound:true}}}

function opening(){return `<section class="opening"><div class="opening-inner"><div class="eyebrow">A classroom game of narrative control</div><h1>THE<br><span class="muted">PERSUASION</span><br>WAR</h1><div class="tagline">CAN YOU CONTROL THE NARRATIVE?</div><button class="primary" data-action="begin">Enter the war</button><div class="small" style="margin-top:22px">15 players · one screen · no devices required</div></div></section>`}
function mast(phase){return `<div class="mast"><div class="brand">THE <span>PERSUASION WAR</span></div><div class="top-actions"><span class="phase-label">${esc(phase)}</span><button class="ghost" data-action="sound">${soundOn?"SOUND ON":"SOUND OFF"}</button><button class="ghost" data-action="operator">OPERATOR</button></div></div>`}
 function setup(){const grouped=new Set(state.lockedGroups.flat());const editing=state.lockEdit!==null&&state.lockEdit!==undefined;return `<section class="screen light-screen"><div class="content">${mast("operator setup")}<div class="setup-header"><div><div class="eyebrow">Name entry · teacher only</div><h2>Identify the players.</h2><p class="muted">Every seat must be named before the draw begins. Names are saved locally as you type.</p></div><div class="count-badge"><strong id="nameCount">${state.names.filter(Boolean).length}</strong> / 15 filled</div></div><div class="panel"><div class="name-grid">${state.names.map((n,i)=>`<label class="name-field"><span class="name-no">${String(i+1).padStart(2,"0")}</span><input data-name="${i}" value="${esc(n)}" placeholder="Student ${i+1}" maxlength="30"></label>`).join("")}</div><div class="lock-panel"><div class="eyebrow">Controlled randomness</div><h3>Lock students together before the spinner.</h3><p class="small">Select two or more named students, then create a group. Groups are treated as indivisible units and must still fit 4 / 4 / 4 / 3.</p><div class="lock-student-grid">${state.names.map((n,i)=>`<button type="button" class="lock-student ${state.lockDraft.includes(i)?"selected":""}" data-action="toggleLockStudent" data-index="${i}" ${!n.trim()?"disabled":""}><span class="lock-check">${state.lockDraft.includes(i)?"✓":"○"}</span><span>${esc(n||"Student "+(i+1))}</span></button>`).join("")}</div><div class="actions"><button class="ghost" data-action="${editing?"saveLockedGroup":"createLockedGroup"}>${editing?"Save group changes":"Create locked group"}</button>${editing?'<button class="ghost" data-action="cancelLockedEdit">Cancel edit</button>':""}</div><div class="lock-groups">${state.lockedGroups.length?state.lockedGroups.map((g,gi)=>`<div class="lock-chip"><strong>⌖ Locked group ${gi+1}</strong><span>${g.map(i=>esc(state.names[i]||"Unnamed")).join(" · ")}</span><div class="actions"><button data-action="editLockedGroup" data-index="${gi}">Edit</button><button data-action="deleteLockedGroup" data-index="${gi}">Delete</button></div></div>`).join(""):'<span class="small">No locked groups. All students will be randomized individually.</span>'}</div></div><div id="setupNotice" class="notice"></div><div class="actions"><div class="small">Names persist through refresh. Duplicate names are allowed only after a warning.</div><span class="spacer"></span><button class="primary" data-action="startSetup" ${state.names.filter(Boolean).length<15?"disabled":""}>Start constrained draw</button></div></div></div></section>`}
function assignment(){const done=state.assignIndex>=15;return `<section class="screen"><div class="content">${mast("constrained draw")}<div class="eyebrow">Random assignment · enforced 4 / 4 / 4 / 3</div><div class="assign-stage panel"><div class="assign-name">${done?"DRAW COMPLETE":esc(state.assignment[state.assignIndex]||"Preparing...")}</div><div class="assign-sub">${done?"All 15 players placed":"Assigning player "+(state.assignIndex+1)+" of 15"}</div>${done?`<div class="team-roster">${state.teams.map((t,i)=>`<div class="team-tile">${symbol(t.symbol)}<h3>Team ${i+1}</h3><div class="members">${t.members.map(esc).join("<br>")}</div></div>`).join("")}</div><button class="primary" data-action="toNaming" style="margin-top:28px">Name the teams</button>`:"<div class=\"small\">The table will not accept an invalid roster.</div>"}</div></div></section>`}
 function naming(){const t=state.teams[state.namingIndex];return `<section class="screen light-screen"><div class="content">${mast("team identity")}<div class="team-naming panel">${symbol(t.symbol)}<div class="eyebrow">Team ${state.namingIndex+1} of 4 · your members</div><h2>Name your faction.</h2><div class="members" style="margin-bottom:22px">${t.members.map(esc).join(" · ")}</div><input class="big-input" id="teamName" maxlength="28" value="${esc(t.name||"")}" placeholder="Enter a team name"><div id="teamNotice" class="notice"></div><button class="primary" data-action="saveTeamName">${state.namingIndex===3?"Enter Phase 1":"Continue"}</button></div></div></section>`}
 function p1Header(){const t=team(state.currentTeam);return `${mast("phase 1 · question war")}<div class="phase-title"><div><div class="eyebrow">Phase 1 / Question War · round ${state.round}</div><h2>Make the room believe you.</h2></div><div class="team-meta">${symbol(t.symbol)}<div><strong>${esc(t.name)}</strong><div class="small">team turn</div></div></div></div>`}
function teamStatus(t){return `<div class="status-strip"><div class="stat"><label>Health</label><strong>${t.health}</strong><div class="healthbar"><i style="width:${t.health}%"></i></div></div><div class="stat"><label>Phase 1 points</label><strong>${fmt(t.points)}</strong></div><div class="stat"><label>Stored abilities</label><strong>${t.inventory.length}</strong><div class="ability-row">${t.inventory.map(x=>`<span class="pill ${x==="shield"||x==="mirror"?"red":""}">${esc(abilityName(x))}</span>`).join("")||'<span class="small">none</span>'}</div></div><div class="stat"><label>Status</label><strong>${t.eliminated?"OUT":"ALIVE"}</strong><div class="small">${t.shield?"SHIELD ARMED · ":""}${t.extraTime?"EXTRA TIME READY":""}</div></div></div>`}
  function p1turn(){const t=team(state.currentTeam);return `<section class="screen light-screen"><div class="content">${p1Header()}${teamStatus(t)}<div class="turn-callout"><div class="eyebrow">Team ${esc(t.name)}</div><h2>Your turn.</h2><p>Choose whether to visit the shop. Your stored abilities remain separate from this decision.</p></div><div class="grid two"><div class="panel"><div class="eyebrow">Next move</div><h3>Control your resources.</h3><p class="muted">Spend points on abilities now, or go straight to the question menu. Purchased abilities are stored and must be activated deliberately.</p><div class="actions"><button class="primary" data-action="p1Shop">Open shop</button><button data-action="toDeck">Choose difficulty</button></div></div><div class="panel"><div class="eyebrow">Ability deck</div><h3>${t.inventory.length} stored card${t.inventory.length===1?"":"s"}</h3><p class="muted">Use Health, Shield or Extra Time now. Attack abilities open a target-and-question sequence.</p><button data-action="openAbilityDeck" ${!t.inventory.length?"disabled":""}>Open ability deck</button></div></div></div></section>`}
function abilityName(id){return [...P1_ABILITIES,...P2_ABILITIES].find(a=>a.id===id)?.name||id}
  function p1shop(){const t=team(state.currentTeam);return `<section class="screen light-screen"><div class="content">${p1Header()}${teamStatus(t)}<div class="panel"><div class="phase-title"><div><div class="eyebrow">Phase 1 shop</div><h2>Buy. Store. Decide later.</h2></div><div class="count-badge">Available <strong>${fmt(t.points)}</strong> pts</div></div><div class="ability-grid">${P1_ABILITIES.map(a=>`<div class="ability-card"><b>${a.name}</b><span class="cost">${a.cost} POINTS</span><p>${a.desc}</p><button class="use" data-action="buyP1" data-id="${a.id}" ${t.points<a.cost?"disabled":""}>Purchase + store</button></div>`).join("")}</div><div class="rule"></div><div class="actions"><button data-action="toDeck">Continue to question menu</button><button class="ghost" data-action="p1turn">Back</button></div></div></div></section>`}
function abilityDeck(){const t=team(state.currentTeam);modalHtml=`<div class="modal-back"><div class="modal"><div class="eyebrow">Stored ability deck</div><h3>${esc(t.name)}</h3><p>Each activation is real and consumes exactly one stored card. Attacks require a target and a question.</p><div class="ability-grid" style="grid-template-columns:1fr">${t.inventory.map((id,i)=>{const a=P1_ABILITIES.find(x=>x.id===id);return `<div class="ability-card" style="min-height:0"><b>${a.name}</b><p>${a.desc}</p><button class="use" data-action="useP1" data-index="${i}">Activate</button></div>`}).join("")}</div><div class="actions" style="margin-top:15px"><button class="ghost" data-action="closeModal">Close</button></div></div></div>`;render()}
  function deck(){const levels=[["Easy","#38c98a","•",5,10],["Medium","#39b9d5","◇",10,25],["Hard","#b889e8","✦",15,30],["Extreme","#ef9b4d","✹",25,45]];return `<section class="screen light-screen"><div class="content">${p1Header()}<div class="panel"><div class="phase-title"><div><div class="eyebrow">Question menu · choose your challenge</div><h2>Pick a difficulty.</h2><p class="muted">Choose Easy, Medium, Hard, or Extreme. A remaining question from that level will open immediately.</p></div><div class="count-badge">Questions left <strong>${state.deck.length}</strong></div></div><div class="difficulty-picker">${levels.map(([name,color,glyph,points,seconds])=>{const count=state.deck.filter(id=>QUESTIONS.find(q=>q.id===id)?.d===name).length;return `<button class="difficulty-choice" style="--choice-color:${color}" data-action="chooseDifficulty" data-difficulty="${name}" ${count?"":"disabled"}><span class="choice-mark">${glyph}</span><strong>${name.toUpperCase()}</strong><span class="choice-points">+${points} POINTS · ${seconds} SECONDS</span><span class="choice-count">${count} question${count===1?"":"s"} remaining</span></button>`}).join("")}</div><div class="actions" style="margin-top:20px"><button class="ghost" data-action="p1turn">Return to turn</button></div></div></div></section>`}
   function chooseDifficulty(d){const available=state.deck.filter(id=>QUESTIONS.find(q=>q.id===id)?.d===d);if(!available.length){notice("DIFFICULTY EMPTY","There are no remaining "+d+" questions.");render();return}startQuestion(available[Math.floor(Math.random()*available.length)])}
   function drawAnyQuestion(){if(!state.deck.length){state.screen="standings";render();return}startQuestion(state.deck[Math.floor(Math.random()*state.deck.length)])}
   function questionTime(q){return ({Easy:10,Medium:25,Hard:30,Extreme:45}[q?.d]||30)+(state.phase1Extra?15:0)}
 function question(){const q=state.currentQuestion,t=team(state.currentTeam),base=state.timerBase||questionTime(q),remaining=Math.max(0,Math.ceil((state.timerEnd-Date.now())/1000)),written=isWrittenQuestion(q),extraActive=base>({Easy:10,Medium:25,Hard:30,Extreme:45}[q.d]||30);const response=written?`<div class="written-response"><div class="write-prompt">${q.questionType==="fill"?"FILL IN THE BLANK":"WRITE YOUR ANSWER"}</div><textarea id="writtenResponse" placeholder="${q.questionType==="fill"?"Type the missing word or phrase...":"Type the team’s response here, or discuss aloud and write a brief record..."}">${esc(state.writtenResponse||"")}</textarea><div class="actions"><button class="primary" data-action="submitWritten">Submit / answer ready</button></div><div class="small">Written responses are never auto-graded. The operator will judge the answer after submission.</div></div>`:`<div class="response-label">${q.questionType==="true-false"?"Choose true or false":"Choose the best-supported response"} · ${q.questionType.toUpperCase()}</div><div class="options ${q.questionType==="true-false"?"binary-options":""}">${q.o.map((o,i)=>`<button class="option" data-action="answer" data-answer="${i}"><span class="option-letter">${String.fromCharCode(65+i)}</span>${esc(o)}</button>`).join("")}</div><div class="actions" style="margin-top:18px"><button class="ghost" data-action="teacherCorrect">Operator: mark correct</button><button class="ghost" data-action="teacherWrong">Operator: mark incorrect</button></div>`;return `<section class="screen light-screen"><div class="content">${mast("phase 1 · question")}<div class="question-layout"><div class="panel question-card"><div class="q-top"><span class="difficulty">${state.phase1AbilityMode?abilityName(state.phase1AbilityMode)+" · ":""}${q.d}</span><span class="category">${esc(q.cat)} · ${q.questionType.toUpperCase()}</span></div><h2 class="question-text">${esc(q.q)}</h2>${response}</div><div class="timer-box"><div class="timer" id="timer" style="--progress:${Math.min(100,remaining/base*100)}%"><strong id="timerNum">${remaining}</strong></div><p>TIME LIMIT · ${base} SECONDS</p><div class="small" style="margin-top:16px;text-align:center">${extraActive?"EXTRA TIME ACTIVE · +15s":""}</div></div></div></div></section>`}
  function timeoutJudge(){const q=state.currentQuestion;return `<section class="screen light-screen"><div class="content">${mast("phase 1 · operator judgment")}<div class="panel timeout-panel"><div class="eyebrow">Timer ended · no automatic penalty</div><div class="timeout-title">TIME<br>IS UP.</div><div class="judge-label">Question</div><p class="judge-question">${esc(q.q)}</p><div class="judge-label">Recorded response</div><div class="submitted-answer">No option was submitted before the timer ended. The operator must decide.</div><div class="timeout-options">${q.o.map((o,i)=>`<div><b>${String.fromCharCode(65+i)}</b>${esc(o)}</div>`).join("")}</div><div class="judge-actions"><button class="primary" data-action="judgeTimeoutCorrect">CORRECT · +${DIFFICULTIES[q.d].correct} POINTS</button><button class="danger" data-action="judgeTimeoutWrong">INCORRECT · −${DIFFICULTIES[q.d].damage} HEALTH</button></div></div></div></section>`}
  function writtenJudge(){const q=state.currentQuestion;return `<section class="screen light-screen"><div class="content">${mast("phase 1 · operator judgment")}<div class="panel judge-panel"><div class="eyebrow">${state.timeExpired?"TIME IS UP · no automatic penalty":"Written answer · teacher decides"}</div><h2>${state.timeExpired?"Judge after the timer.":"Judge the response."}</h2><div class="judge-grid"><div><div class="judge-label">Question</div><p class="judge-question">${esc(q.q)}</p><div class="judge-label">Submitted response</div><div class="submitted-answer">${esc(state.writtenResponse||"NO RESPONSE SUBMITTED BEFORE TIME EXPIRED")}</div></div><div><div class="judge-label">Expected / model answer</div><div class="model-answer">${esc(q.model||q.x)}</div><div class="judge-label">Why this matters</div><p class="muted">${esc(q.x)}</p></div></div><div class="judge-actions"><button class="primary" data-action="judgeWrittenCorrect">CORRECT · +${DIFFICULTIES[q.d].correct} POINTS</button><button class="danger" data-action="judgeWrittenWrong">INCORRECT · −${DIFFICULTIES[q.d].damage} HEALTH</button></div></div></div></section>`}
function result(){const r=state.result,t=team(state.currentTeam);return `<section class="screen"><div class="content">${mast("phase 1 · result")}<div class="result panel ${r.correct?"correct":"incorrect"} ${r.correct?"":"damage-flash"}"><div><div class="eyebrow">${r.timeout?"Time expired":"Answer resolved"} · ${esc(t.name)}</div><h2>${r.correct?"CORRECT":"INCORRECT"}</h2><div class="delta">${r.delta>0?"+":""}${r.delta} ${r.kind==="points"?"POINTS":"HEALTH"}</div><p class="explain">${esc(r.explanation)}</p>${t.eliminated?'<div class="eyebrow" style="margin-top:20px">ELIMINATED · points preserved</div>':""}<button class="primary" data-action="nextAfterResult" style="margin-top:20px">Continue</button></div></div></div></section>`}
 function standings(){return `<section class="screen"><div class="content">${mast("phase 1 complete")}<div class="phase-title"><div><div class="eyebrow">Phase 1 final standings</div><h2>The question war closes.</h2></div><div class="small">Scores are preserved through conversion.</div></div><div class="panel"><table class="standings"><thead><tr><th>Rank</th><th>Team</th><th>Health</th><th>Points</th><th>Status</th></tr></thead><tbody>${[...state.teams].sort((a,b)=>b.points-a.points).map((t,i)=>`<tr><td class="num">${i+1}</td><td>${symbol(t.symbol)}<strong>${esc(t.name)}</strong></td><td>${t.health}</td><td class="num">${fmt(t.points)}</td><td class="${t.eliminated?"eliminated":""}">${t.eliminated?"ELIMINATED":"SURVIVING"}</td></tr>`).join("")}</tbody></table><div class="actions" style="margin-top:20px"><button class="primary" data-action="toConversion">Convert points to energy</button></div></div></div></section>`}
function conversion(){const alive=state.teams.filter(t=>!t.eliminated);return `<section class="screen"><div class="content">${mast("phase transition")}<div class="conversion panel"><div class="eyebrow">Points → Phase 2 Energy</div><h2>Convert the advantage.</h2><p class="muted">The original Phase 1 points remain on the record. Set the multiplier before the arena opens.</p><div class="actions" style="justify-content:center;margin:20px 0"><label class="small">Multiplier <input id="multiplier" type="number" min="1" max="1000" value="${state.multiplier}" style="width:110px;margin-left:8px"> energy / point</label></div><div class="energy-number">${fmt(alive.reduce((n,t)=>n+t.points*state.multiplier,0))}</div><p class="small">${alive.length} surviving team${alive.length===1?"":"s"} · default 1 point = 100 energy</p><button class="primary" data-action="convert">Open the bias war</button></div></div></section>`}
function transition(){return `<section class="cinema"><div><div class="beat" id="cinemaBeat">YOU THOUGHT THE GAME WAS ABOUT ANSWERS.</div><small>Phase transition · click to continue or wait</small><button class="ghost" data-action="skipCinema" style="margin-top:22px">Skip cinematic</button></div></section>`}
 function arena(){const t=team(state.currentTeam),news=state.news||NEWS[state.newsIndex%NEWS.length];return `<section class="screen"><div class="content">${mast("phase 2 · the bias war")}<div class="arena-head"><div><div class="eyebrow">Symbolic arena · identities masked</div><h2>Control the frame.</h2></div><div class="current-symbol">${symbol(t.symbol)}<div><span class="small">Current turn</span><br><strong>SYMBOL ${state.currentTeam+1}</strong></div></div></div><div class="news"><small>Live information feed · classify the framing</small><p>${esc(news.text)}</p></div><div class="arena ${state.turnTransition?"turn-transition":""}"><div class="arena-teams">${state.teams.map((x,i)=>`<div class="arena-team ${x.eliminated?"dead":""} ${i===state.currentTeam?"active":""} ${state.p2Target===i?"targeted":""}" style="--team-color:${TEAM_COLORS[i]}" data-symbol="${i}">${symbol(x.symbol)}<h3>SYMBOL ${i+1}</h3><div class="arena-stat"><span>HEALTH</span> <b>${x.health}</b><span>ENERGY</span> <b>${fmt(x.energy)}</b><span>OPINION</span> <b>${x.opinion}</b><small style="font-size:8px;color:#555;line-height:1.3">${publicOpinionLabel(x.opinion)}</small></div><div class="healthbar"><i style="width:${x.health}%"></i></div></div>`).join("")}</div><div class="arena-core"></div></div><div class="panel" style="margin-top:16px"><div class="actions"><div><div class="eyebrow">Turn protocol</div><strong>Purchase exactly one ability, then use it immediately.</strong></div><span class="spacer"></span><button class="primary" data-action="openP2Purchase" ${state.p2TurnSpent?"disabled":""}>${state.p2TurnSpent?"TURN IN PROGRESS":"Open energy shop"}</button></div></div></div></section>`}
 function p2purchase(){const t=team(state.currentTeam);return `<section class="screen"><div class="content">${mast("phase 2 · purchase")}<div class="phase-title"><div><div class="eyebrow">One purchase. One use. Full stop.</div><h2>Choose the event.</h2></div><div class="count-badge">Energy <strong>${fmt(t.energy)}</strong></div></div><div class="panel"><div class="ability-grid">${P2_ABILITIES.map(a=>`<div class="ability-card"><b>${a.name}</b><span class="cost">${a.id==="bomb"&&state.bombUsed?"PERMANENTLY UNAVAILABLE":fmt(a.cost)+" ENERGY"}</span><p>${a.desc}</p><button class="use" data-action="buyP2" data-id="${a.id}" ${(state.p2TurnSpent||t.energy<a.cost||(a.id==="bomb"&&state.bombUsed))?"disabled":""}>${state.p2TurnSpent?"TURN ALREADY SPENT":"Purchase and use"}</button></div>`).join("")}</div><div class="rule"></div><button class="ghost" data-action="arena">Return to arena</button></div></div></section>`}
function targetReason(){return state.p2AbilityMode==="censorship"?"Choose the team whose next turn will be censored.":state.p2AbilityMode==="fake"?"Choose a team to receive the misleading statement.":state.p2AbilityMode==="hijack"?"Choose an opposing team to hijack.":"Choose an opposing team for the strike."}
 function p2target(){const possible=state.teams.map((t,i)=>({t,i})).filter(x=>!x.t.eliminated&&x.i!==state.currentTeam);return `<section class="screen"><div class="content">${mast("phase 2 · target")}<div class="panel"><div class="eyebrow">Target selection</div><h2>${esc(targetReason())}</h2><p class="muted">Names stay hidden in the arena. Select a surviving enemy symbol, then confirm.</p><div class="targets">${possible.map(x=>`<button class="target-card ${state.p2Target===x.i?"selected":""}" data-action="selectTarget" data-index="${x.i}">${symbol(x.t.symbol)}<div><h3>SYMBOL ${x.i+1}</h3><p>Health ${x.t.health} · Opinion ${x.t.opinion}</p></div></button>`).join("")}</div><div class="actions" style="margin-top:18px"><button class="primary" data-action="confirmTarget" ${state.p2Target===null||state.p2Target===undefined?"disabled":""}>Confirm target</button><button class="ghost" data-action="p2purchase">Back</button></div></div></div></section>`}
function p2fake(){const f=state.fakeQuestion;return `<section class="screen"><div class="content">${mast("phase 2 · fake news")}<div class="fake-question panel"><div class="eyebrow">The target must classify the frame</div><h2>FACT / OPINION / BIAS / PROPAGANDA?</h2><p class="question-text">${esc(f.q)}</p><div class="options">${["FACT","OPINION","BIAS","PROPAGANDA"].map((x,i)=>`<button class="option" data-action="fakeAnswer" data-answer="${i}"><span class="option-letter">${String.fromCharCode(65+i)}</span>${x}</button>`).join("")}</div></div></div></section>`}
function p2complete(){return `<section class="screen"><div class="content">${mast("phase 2 · turn complete")}<div class="result panel ${state.p2Pending?.success?"correct":"incorrect"}"><div><div class="eyebrow">One purchase · one use</div><h2>${state.p2Pending?.headline||"RESOLVED"}</h2><p class="explain">${esc(state.p2Pending?.text||"The action has resolved.")}</p><button class="primary" data-action="nextP2">Next surviving turn</button></div></div></div></section>`}
 function p2exhausted(){const t=team(state.exhaustionTeam);return `<section class="exhaustion"><div><div class="eyebrow">Phase 2 elimination sequence</div>${symbol(t.symbol,"exhaustion-symbol")}<h1>NO RESOURCES<br>REMAIN</h1><p>ENERGY DEPLETED · SYMBOL ELIMINATED</p><button class="primary" data-action="finishExhaustion">Continue</button></div></section>`}
function narrative(){const n=NARRATIVE[state.narrativeIndex];return `<section class="screen"><div class="content">${mast("final narrative")}<div class="narrative panel"><div class="eyebrow">Final Narrative · deterministic reward</div><h2>Read the frame before it reads you.</h2><p class="muted">Correct classifications award +5 Public Opinion to the current team. This reward is tracked separately from health.</p><div class="narrative-card"><p>${esc(n.q)}</p><div class="options">${["FACT","OPINION","BIAS","PROPAGANDA"].map((x,i)=>`<button class="option" data-action="narrativeAnswer" data-answer="${i}"><span class="option-letter">${String.fromCharCode(65+i)}</span>${x}</button>`).join("")}</div></div><div class="small">${state.narrativeIndex+1} / ${NARRATIVE.length}</div></div></div></section>`}
 function victoryReveal(){const t=team(state.victoryTeam);return `<section class="reveal-stage"><div><div class="beat" id="winnerBeat">${esc(["AFTER EVERYTHING YOU SAW...","AFTER EVERYTHING YOU HEARD...","AFTER ALL THE CLAIMS...","ALL THE BIAS...","ALL THE PROPAGANDA...","THE WINNER IS...","THE TEAM THAT CONTROLLED THE NARRATIVE."][state.victoryBeat]||"THE WINNER IS...")}</div><div class="reveal-note">The arena is quiet. The frame is closing.</div><button class="ghost" data-action="skipWinnerReveal" style="margin-top:26px">Reveal winner</button></div></section>`}
 function victory(){const t=team(state.victoryTeam),color=TEAM_COLORS[state.victoryTeam]||"#d20b24";return `<section class="victory"><div class="victory-inner"><div class="eyebrow">The Bias War is over.</div><h1>THE<br>WINNER</h1><div style="--winner-color:${color}">${symbol(t.symbol,"winner-symbol")}</div><div class="winner-name">${esc(t.name)}</div><p class="tagline">MASTER OF PERSUASION</p><div class="actions" style="justify-content:center"><button class="primary" data-action="restart">Restart game</button><button class="ghost" data-action="operator">Operator record</button></div></div></section>`}

 function startSetup(){const fields=state.names.map(x=>x.trim()).filter(Boolean),dupes=fields.filter((x,i)=>fields.indexOf(x)!==i);if(fields.length!==15)return document.getElementById("setupNotice").textContent="Exactly 15 filled names are required.";if(dupes.length)document.getElementById("setupNotice").textContent="Duplicate names detected. Confirm they are intentional, then press Start again.";const ok=state._dupWarn;if(dupes.length&&!ok){state._dupWarn=true;save();return}const plan=lockedTeamPlan();if(!plan.ok){document.getElementById("setupNotice").textContent="INVALID TEAM CONFIGURATION — "+plan.error;return}snapshot();state.assignmentTeams=plan.teams.map(ids=>ids.map(i=>state.names[i].trim()));state.assignment=state.assignmentTeams.flat();state.teams=[0,1,2,3].map((_,i)=>({name:"",members:[...state.assignmentTeams[i]],symbol:["diamond","triangle","circle","star"][i],health:100,points:0,energy:0,opinion:50,inventory:[],shield:false,extraTime:false,mirror:false,mediaShield:false,skipNextTurn:false,eliminated:false}));state.assignIndex=0;state.screen="assignment";render()}

  function startQuestionTimer(){clearInterval(timerId);timerId=setInterval(()=>{if(state.screen!=="question"){clearInterval(timerId);return}const remain=Math.max(0,Math.ceil((state.timerEnd-Date.now())/1000)),el=document.getElementById("timer"),num=document.getElementById("timerNum");if(!el||!num)return;num.textContent=remain;el.style.setProperty("--progress",Math.max(0,remain/state.timerBase*100)+"%");el.classList.toggle("warn",remain<=10&&remain>5);el.classList.toggle("critical",remain<=5);if(remain<=0){clearInterval(timerId);state.timeExpired=true;if(isWrittenQuestion()){const field=document.getElementById("writtenResponse");if(field&&field.value.trim())state.writtenResponse=field.value.trim();state.screen="writtenJudge";render()}else{state.screen="timeoutJudge";render()}}},200)}
  function resolveAnswer(index,timeout=false){if(state.screen!=="question")return;clearInterval(timerId);snapshot();const q=state.currentQuestion,t=team(state.currentTeam),correct=!timeout&&index===q.a;let delta,kind="points",explanation=q.x;if(state.phase1AbilityMode){const mode=state.phase1AbilityMode,target=state.phase1Target;state.phase1AbilityMode=null;state.phase1Target=null;if(correct){delta=mode==="heavy"?30:20;const hit=damage(target,delta);kind="health";explanation=hit.blocked?"The target's shield absorbed the attack. "+q.x:q.x+" The target loses "+delta+" health."}else{delta=mode==="heavy"?30:20;const hit=damage(state.currentTeam,delta);kind="health";explanation=timeout?"The timer expired, so the attack reflected onto the attacker.":q.x+" The attack reflects onto the attacker.";if(hit.eliminated)explanation+=" The attacker is eliminated."}state.result={correct,delta:-delta,kind,explanation,timeout};}else if(correct){t.points+=q.p;state.result={correct:true,delta:q.p,kind:"points",explanation:q.x}}else{const hit=damage(state.currentTeam,DIFFICULTIES[q.d].damage);state.result={correct:false,delta:-DIFFICULTIES[q.d].damage,kind:"health",explanation:q.x+(hit.eliminated?" The team is eliminated.":""),timeout}}state.screen="result";render()}

 function resolveWritten(correct){if(state.screen!=="writtenJudge")return;clearInterval(timerId);snapshot();const q=state.currentQuestion,t=team(state.currentTeam);let delta,kind="points",explanation=q.x;if(state.phase1AbilityMode){const mode=state.phase1AbilityMode,target=state.phase1Target;state.phase1AbilityMode=null;state.phase1Target=null;delta=mode==="heavy"?30:20;if(correct){const hit=damage(target,delta);kind="health";explanation=hit.blocked?"The target's shield absorbed the written-answer attack. "+q.x:q.x+" The target loses "+delta+" health."}else{const hit=damage(state.currentTeam,delta);kind="health";explanation="The written attack was judged incorrect and reflects "+delta+" damage onto the attacker."+(hit.eliminated?" The attacker is eliminated.":"")}}else if(correct){delta=q.p;t.points+=q.p;explanation=q.x}else{delta=DIFFICULTIES[q.d].damage;const hit=damage(state.currentTeam,delta);kind="health";explanation=q.x+(hit.eliminated?" The team is eliminated.":"")}state.result={correct,delta:correct&&kind==="points"?delta:-delta,kind,explanation,timeout:state.timeExpired};state.timeExpired=false;state.screen="result";render()}

 function confirmTarget(){if(state.p2Target===null||state.p2Target===undefined)return;const id=state.p2AbilityMode;if(id==="fake"){state.fakeQuestion=FAKE_NEWS[(state.newsIndex+state.currentTeam)%FAKE_NEWS.length];state.screen="p2fake";render()}else if(id==="strike"){const hit=p2Attack(state.currentTeam,state.p2Target,25);team(state.currentTeam).opinion=Math.min(100,team(state.currentTeam).opinion+3);completeP2(!hit.blocked,"PROPAGANDA STRIKE",hit.reflected?"The target's Propaganda Mirror reflected the 25 damage to the attacker.":hit.blocked?"The target's shield absorbed the 25 damage.":"The target takes exactly 25 damage.");}else if(id==="censorship"){team(state.p2Target).skipNextTurn=true;team(state.currentTeam).opinion=Math.min(100,team(state.currentTeam).opinion+2);completeP2(true,"CENSORSHIP DEPLOYED","The target's next surviving turn is skipped exactly once.");}else if(id==="hijack"){const target=team(state.p2Target),attacker=team(state.currentTeam);const stolen=Math.min(1500,target.energy);target.energy-=stolen;target.opinion=Math.max(0,target.opinion-10);attacker.energy+=stolen;completeP2(true,"NARRATIVE HIJACK","The target loses 10 Public Opinion and 1,500 Energy was stolen from them (or all remaining Energy if they had less).",false);}else if(id==="rumor"){const target=team(state.p2Target);target.opinion=Math.max(0,target.opinion-3);completeP2(true,"TINY RUMOR","The target loses 3 Public Opinion.");}}

function publicOpinionEnergyMultiplier(opinion){if(opinion>=80)return 1.10;if(opinion<20)return 0.80;if(opinion<40)return 0.90;return 1.00} function publicOpinionLabel(opinion){if(opinion>=80)return "HIGH · +10% Energy from successful actions";if(opinion<20)return "CRITICAL · -20% Energy from successful actions";if(opinion<40)return "LOW · -10% Energy from successful actions";return "STABLE · no Energy modifier"} function completeP2(success,headline,text){if(success){const t=team(state.currentTeam),bonus=Math.floor(500*publicOpinionEnergyMultiplier(t.opinion));t.energy+=bonus;text+=(text?" ":"")+`Successful action reward: +${fmt(bonus)} Energy (${publicOpinionLabel(t.opinion)}).`}state.p2Pending={success,headline,text};state.p2AbilityMode=null;state.p2Target=null;state.screen="p2complete";render()}

function doRestart(){localStorage.removeItem(KEY);operatorOpen=false;state=blankState();render()}
 function bind(){document.querySelectorAll("[data-action]").forEach(el=>el.addEventListener("click",e=>{const a=el.dataset.action;if(a==="begin")begin();else if(a==="sound"){soundOn=!soundOn;state.settings.sound=soundOn;render()}else if(a==="operator"){operatorOpen=!operatorOpen;render()}else if(a==="startSetup")startSetup();else if(a==="createLockedGroup"||a==="saveLockedGroup")saveLockedGroup();else if(a==="toggleLockStudent"){const i=Number(el.dataset.index);if(state.lockDraft.includes(i))state.lockDraft=state.lockDraft.filter(x=>x!==i);else state.lockDraft=[...state.lockDraft,i];render();}else if(a==="cancelLockedEdit"){state.lockDraft=[];state.lockEdit=null;render()}else if(a==="editLockedGroup"){state.lockEdit=Number(el.dataset.index);state.lockDraft=[...state.lockedGroups[state.lockEdit]];render()}else if(a==="deleteLockedGroup"){deleteLockedGroup(Number(el.dataset.index))}else if(a==="removeLockedStudent"){removeLockedStudent(Number(el.dataset.group),Number(el.dataset.student))}else if(a==="toNaming"){state.screen="naming";render()}else if(a==="saveTeamName")saveTeamName();else if(a==="p1Shop")state.screen="p1shop",render();else if(a==="toDeck")state.screen="deck",render();else if(a==="p1turn")state.screen="p1turn",render();else if(a==="buyP1")buyP1(el.dataset.id);else if(a==="openAbilityDeck")openAbilityDeck();else if(a==="useP1")useP1(Number(el.dataset.index));else if(a==="closeModal"){modalHtml="";render()}else if(a==="p1Target"){state.phase1Target=Number(el.dataset.index);const t=team(state.phase1Target);modalHtml=`<div class="modal-back"><div class="modal"><div class="eyebrow">Target confirmed</div><h3>${esc(t.name)}</h3><p>Draw a question. A correct answer deals damage; an incorrect answer reflects damage onto your team.</p><div class="actions"><button class="primary" data-action="attackDraw">Draw attack question</button><button class="ghost" data-action="closeModal">Cancel</button></div></div></div>`;render()}else if(a==="attackDraw"){modalHtml="";drawAnyQuestion()}else if(a==="chooseDifficulty"){chooseDifficulty(el.dataset.difficulty)}else if(a==="answer")resolveAnswer(Number(el.dataset.answer));else if(a==="submitWritten")submitWritten();else if(a==="judgeWrittenCorrect")resolveWritten(true);else if(a==="judgeWrittenWrong")resolveWritten(false);else if(a==="judgeTimeoutCorrect")resolveTimeout(true);else if(a==="judgeTimeoutWrong")resolveTimeout(false);else if(a==="teacherCorrect")resolveAnswer(state.currentQuestion.a);else if(a==="teacherWrong")resolveAnswer((state.currentQuestion.a+1)%state.currentQuestion.o.length);else if(a==="nextAfterResult")nextResult();else if(a==="toConversion")state.screen="conversion",render();else if(a==="convert")convert();else if(a==="skipCinema")toArena();else if(a==="skipWinnerReveal"){clearTimeout(cinemaTimer);state.screen="victory";render()}else if(a==="finishExhaustion")finishExhaustion();else if(a==="arena")state.screen="arena",render();else if(a==="openP2Purchase"||a==="p2purchase")state.screen="p2purchase",render();else if(a==="buyP2")buyP2(el.dataset.id);else if(a==="selectTarget"){state.p2Target=Number(el.dataset.index);render()}else if(a==="confirmTarget")confirmTarget();else if(a==="fakeAnswer")fakeAnswer(Number(el.dataset.answer));else if(a==="nextP2")nextP2();else if(a==="narrativeAnswer")narrativeAnswer(Number(el.dataset.answer));else if(a==="restart")restart();else if(a==="confirmRestart")doRestart();else if(a==="undo")undo();else if(a==="adjustTeam")adjustTeam();else if(a==="skipTurn")skipTurn();else if(a==="eliminate")opEliminate();else if(a==="skipQuestion")skipQuestion()}));
document.querySelectorAll("[data-name]").forEach(el=>el.addEventListener("input",()=>{state.names[Number(el.dataset.name)]=el.value;const c=document.getElementById("nameCount");if(c)c.textContent=state.names.filter(x=>x.trim()).length;const b=document.querySelector('[data-action="startSetup"]');if(b)b.disabled=state.names.filter(x=>x.trim()).length<15;save()}));
const ti=document.getElementById("teamName");if(ti)ti.addEventListener("keydown",e=>{if(e.key==="Enter")saveTeamName()});
const op=document.getElementById("opTeam");if(op)op.addEventListener("change",()=>fillOp());if(op)fillOp();
}
function fillOp(){const i=Number(document.getElementById("opTeam")?.value||0),t=team(i);if(!t)return;const h=document.getElementById("opHealth"),p=document.getElementById("opPoints"),e=document.getElementById("opEnergy");if(h)h.value=t.health;if(p)p.value=t.points;if(e)e.value=t.energy}
function adjustTeam(){const i=Number(document.getElementById("opTeam").value),t=team(i);snapshot();t.health=Math.max(0,Math.min(100,Number(document.getElementById("opHealth").value)||0));t.points=Math.max(0,Number(document.getElementById("opPoints").value)||0);t.energy=Math.max(0,Number(document.getElementById("opEnergy").value)||0);eliminateCheck(i);save();render();notice("OPERATOR","Team values updated.");}
function skipTurn(){if(state.phase===1){state.currentTeam=nextAlive();state.screen="p1turn";render()}else if(state.phase===2){nextP2()}}
function opEliminate(){const i=Number(document.getElementById("opTeam").value);snapshot();team(i).health=0;team(i).eliminated=true;save();render();notice("OPERATOR","Team eliminated manually.")}
 function skipQuestion(){if(state.screen==="question"){clearInterval(timerId);state.timeExpired=true;if(isWrittenQuestion()){const field=document.getElementById("writtenResponse");if(field&&field.value.trim())state.writtenResponse=field.value.trim();state.screen="writtenJudge"}else state.screen="timeoutJudge";render()}}
load();soundOn=state.settings?.sound||false;render();
})();
</script>
</body>
</html>

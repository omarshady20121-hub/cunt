<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THE PERSUASION WAR</title>
<style>
:root{--black:#050505;--panel:#0c0c0c;--panel2:#141414;--white:#f7f7f7;--muted:#9c9c9c;--red:#d20b24;--red2:#7e0718;--red3:#ff2845;--line:#4b0a15;--shadow:0 18px 60px #000}
*{box-sizing:border-box}
html,body{margin:0;background:var(--black);color:var(--white);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100%;overflow-x:hidden}
body{background:radial-gradient(ellipse at 50% -15%,#2c050a 0,#0a0506 32%,#050505 68%);letter-spacing:.01em}
button,input{font:inherit}
button{cursor:pointer;color:var(--white);background:#101010;border:1px solid var(--red2);border-radius:2px;padding:13px 19px;text-transform:uppercase;letter-spacing:.12em;font-size:11px;font-weight:800;transition:.18s ease;box-shadow:0 0 0 transparent}
button:hover:not(:disabled),button:focus-visible:not(:disabled){background:var(--red2);border-color:var(--red3);box-shadow:0 0 24px #d20b2433;outline:2px solid var(--red);outline-offset:3px}
button:disabled{opacity:.35;cursor:not-allowed}
button.primary{background:var(--red);border-color:var(--red3);color:#fff}
button.ghost{background:transparent;border-color:#555}
button.danger{border-color:var(--red3);color:#fff}
input{background:#090909;border:1px solid #3b3b3b;color:#fff;padding:13px 14px;border-radius:2px;outline:none}
input:focus{border-color:var(--red);box-shadow:0 0 15px #d20b2428}
::selection{background:var(--red);color:#fff}
.hidden{display:none!important}
.app{min-height:100vh;position:relative}
.screen{min-height:100vh;padding:28px 4vw 34px;position:relative;animation:screenIn .35s ease both}
@keyframes screenIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.screen:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.18;background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);background-size:72px 72px;mask-image:linear-gradient(to bottom,transparent,#000 20%,transparent 95%)}
.content{position:relative;z-index:1;max-width:1450px;margin:auto}
.mast{display:flex;justify-content:space-between;gap:20px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:15px;margin-bottom:24px}
.brand{font-weight:900;letter-spacing:.22em;font-size:12px}.brand span{color:var(--red)}
.phase-label{color:var(--red3);font-size:11px;letter-spacing:.18em;text-transform:uppercase}
.eyebrow{font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:var(--red3);font-weight:800}
h1,h2,h3,p{margin-top:0}
h1{font-size:clamp(42px,7vw,108px);line-height:.88;letter-spacing:-.075em;margin-bottom:19px;text-transform:uppercase}
h2{font-size:clamp(28px,4vw,58px);letter-spacing:-.04em;line-height:.95}
h3{letter-spacing:.04em;text-transform:uppercase}
.muted{color:var(--muted)}
.small{font-size:11px;color:var(--muted);letter-spacing:.07em}
.rule{height:1px;background:var(--line);margin:20px 0}
.panel{background:linear-gradient(135deg,#121212e8,#070707e8);border:1px solid #36101a;box-shadow:var(--shadow);padding:22px;position:relative}
.panel:after{content:"";position:absolute;inset:7px;border:1px solid #ffffff0b;pointer-events:none}
.grid{display:grid;gap:18px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.spacer{flex:1}
.top-actions{display:flex;gap:8px;align-items:center}.top-actions button{padding:8px 10px;font-size:9px}
.opening{display:grid;place-items:center;text-align:center;min-height:100vh;padding:30px;overflow:hidden}
.opening:before{content:"";position:absolute;width:70vw;height:70vw;border:1px solid var(--red2);border-radius:50%;box-shadow:0 0 100px #d20b241c,inset 0 0 100px #d20b2417;animation:orbit 14s linear infinite}
.opening:after{content:"";position:absolute;width:22vw;height:22vw;border:1px solid var(--red);transform:rotate(45deg);box-shadow:0 0 70px #d20b2440;animation:float 5s ease-in-out infinite}
@keyframes orbit{to{transform:rotate(360deg)}}@keyframes float{50%{transform:rotate(45deg) scale(1.08)}}
.opening-inner{position:relative;z-index:1;animation:titleIn 1s cubic-bezier(.2,.8,.2,1) both}.opening h1{max-width:950px;text-shadow:0 0 35px #d20b2455}.opening .tagline{font-size:clamp(14px,2vw,24px);letter-spacing:.45em;margin:18px 0 40px;color:#fff}
@keyframes titleIn{from{opacity:0;transform:scale(.94);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
.setup-header{display:flex;justify-content:space-between;align-items:end;gap:25px;margin-bottom:20px}.setup-header h2{margin:6px 0}
.name-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:11px}.name-field{display:flex;align-items:center;gap:9px}.name-no{color:var(--red);font-weight:900;font-size:12px;width:24px}.name-field input{width:100%}
.count-badge{border:1px solid var(--red2);padding:13px 16px;text-transform:uppercase;font-size:11px;letter-spacing:.12em;white-space:nowrap}.count-badge strong{color:var(--red3);font-size:20px}
.notice{min-height:22px;color:var(--red3);font-size:12px;margin-top:15px}
.team-roster{display:flex;gap:24px;align-items:center;flex-wrap:wrap}.team-tile{min-width:220px;flex:1}.team-symbol{width:66px;height:66px;display:grid;place-items:center;color:var(--red3);margin-bottom:13px}.team-symbol svg{width:100%;height:100%;filter:drop-shadow(0 0 11px #d20b2455)}.team-tile h3{margin:0 0 6px}.members{color:var(--muted);font-size:13px;line-height:1.7}
.assign-stage{text-align:center;min-height:400px;display:flex;flex-direction:column;justify-content:center;align-items:center}.assign-name{font-size:clamp(36px,6vw,90px);font-weight:900;text-transform:uppercase;letter-spacing:-.06em;animation:selectName .5s ease both}.assign-sub{margin:10px 0 26px;color:var(--muted);letter-spacing:.16em;text-transform:uppercase;font-size:12px}
@keyframes selectName{from{opacity:0;transform:translateY(25px) scale(.9)}to{opacity:1;transform:none}}
.team-naming{max-width:650px;margin:auto;text-align:center}.big-input{font-size:25px;text-align:center;width:100%;padding:18px}.team-naming .team-symbol{margin:16px auto}
.status-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}.stat{background:#0b0b0b;border:1px solid #32101a;padding:12px 14px}.stat label{display:block;text-transform:uppercase;color:var(--muted);font-size:10px;letter-spacing:.12em}.stat strong{display:block;font-size:25px;margin-top:5px}.stat.danger strong{color:var(--red3)}
.healthbar{height:7px;background:#262626;margin-top:10px;position:relative;overflow:hidden}.healthbar i{display:block;height:100%;background:var(--red);transition:width .7s cubic-bezier(.2,.9,.2,1);box-shadow:0 0 12px var(--red)}.energybar i{background:#fff;box-shadow:0 0 12px #fff}
.phase-title{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:20px}.phase-title h2{margin:5px 0}
.turn-callout{padding:21px 25px;border-left:4px solid var(--red);background:linear-gradient(90deg,#3b0710aa,transparent);margin-bottom:18px}.turn-callout h2{margin:2px 0 6px}.turn-callout p{margin:0;color:var(--muted)}
.team-meta{display:flex;gap:14px;align-items:center}.team-meta .team-symbol{width:44px;height:44px;margin:0}
.ability-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.pill{border:1px solid #4d4d4d;padding:6px 8px;font-size:10px;letter-spacing:.08em;color:#ddd;text-transform:uppercase}.pill.red{border-color:var(--red);color:var(--red3)}

.card-table{min-height:620px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;perspective:1100px;background:radial-gradient(circle at 50% 53%,#30060d 0,#0b0607 28%,#070707 70%);border:1px solid #4a111b}
.card-table:before,.arena:before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 48%,#fff0 49%,#d20b2418 50%,transparent 51%),linear-gradient(20deg,transparent 48%,#fff0 49%,#d20b2410 50%,transparent 51%);opacity:.55;pointer-events:none}
.deck-stack{position:absolute;width:142px;height:200px;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-7deg);border:1px solid var(--red2);background:#0a0a0a;box-shadow:11px 13px 0 #19050a,18px 20px 0 #100307,0 17px 35px #000;z-index:1;transition:.45s}
.deck-stack:before,.deck-stack:after{content:"";position:absolute;inset:10px;border:1px solid var(--red);background:repeating-linear-gradient(45deg,transparent 0 8px,#d20b2423 9px 10px),repeating-linear-gradient(-45deg,transparent 0 8px,#fff10 9px 10px)}.deck-stack:after{inset:24px;transform:rotate(45deg);border-color:#fff4}
.card-fan{position:absolute;inset:0;z-index:3;pointer-events:auto}

.card {
  position:absolute;width:130px;height:182px;left:50%;top:50%;
  transform-origin:50% 50%;margin:-91px -65px;
  pointer-events:auto;
  transform:translate(-50%,-50%) rotate(var(--r)) translateY(calc(-1 * var(--rad)));
  transition:transform .4s cubic-bezier(.2,.8,.2,1), filter .3s, opacity .4s;
  filter:drop-shadow(0 14px 15px #000);
  cursor:pointer;
  animation:dealCards .7s cubic-bezier(.175,.885,.32,1.275) var(--delay) both, cardBreathe 3s ease-in-out calc(.7s + var(--delay)) infinite alternate;
}
.card:hover:not(.selected):not(.receding) {
  animation:none !important;
  transform:translate(-50%,-50%) rotate(var(--r)) translateY(calc(-1 * var(--rad) - 20px)) scale(1.15) !important;
  z-index:40;
  filter:drop-shadow(0 25px 25px #000);
}
.card.receding {
  animation:none !important;
  opacity:0;
  transform:translate(-50%,-50%) rotate(var(--r)) translateY(calc(-1 * var(--rad) + 60px)) scale(.9) !important;
  pointer-events:none;
}
.card.selected {
  animation:none !important;
  transform:translate(-50%,-50%) scale(1.4) rotate(0deg) !important;
  z-index:100 !important;
  pointer-events:none;
  filter:drop-shadow(0 30px 40px #000);
}

.card.diff-easy{--d-rgb:74,222,128;--d-hex:#4ade80}
.card.diff-medium{--d-rgb:250,204,21;--d-hex:#facc15}
.card.diff-hard{--d-rgb:249,115,22;--d-hex:#f97316}
.card.diff-extreme{--d-rgb:239,68,68;--d-hex:#ef4444}

.card-back,.card-front{position:absolute;inset:0;background:#0a0a0a;backface-visibility:hidden;border-radius:4px;display:grid;place-items:center;overflow:hidden}
.card-back{border:2px solid var(--d-hex, var(--red));box-shadow:inset 0 0 20px rgba(var(--d-rgb),.15), 0 0 15px rgba(var(--d-rgb),.3)}
.card-back:before{content:"";position:absolute;inset:10px;border:1px solid rgba(var(--d-rgb),.4);background:repeating-linear-gradient(45deg,transparent 0 8px,rgba(var(--d-rgb),.15) 9px 10px),repeating-linear-gradient(-45deg,transparent 0 8px,rgba(var(--d-rgb),.08) 9px 10px)}
.diff-icon{font-size:55px;color:var(--d-hex);text-shadow:0 0 25px rgba(var(--d-rgb),.8);position:absolute;z-index:2}
.card-front{transform:rotateY(180deg);padding:12px;text-align:center;background:#eee;color:#070707;border:1px solid #aaa}
.card-front b{font-size:18px;text-transform:uppercase;letter-spacing:.1em}
.card-front small{font-size:9px;letter-spacing:.12em}

.card.selected .card-back{animation:flip .7s ease forwards}
.card.selected .card-front{animation:flipFront .7s ease forwards}

@keyframes dealCards{from{transform:translate(-50%,-50%) rotate(0deg) translateY(0) scale(.2);opacity:0}to{transform:translate(-50%,-50%) rotate(var(--r)) translateY(calc(-1 * var(--rad))) scale(1);opacity:1}}
@keyframes cardBreathe{from{transform:translate(-50%,-50%) rotate(var(--r)) translateY(calc(-1 * var(--rad))) scale(1)}to{transform:translate(-50%,-50%) rotate(var(--r)) translateY(calc(-1 * var(--rad) - 6px)) scale(1.02)}}
@keyframes flip{0%,40%{transform:rotateY(0)}100%{transform:rotateY(180deg)}}
@keyframes flipFront{0%,40%{transform:rotateY(180deg)}100%{transform:rotateY(0)}}

.deck-caption{text-align:center;position:absolute;bottom:18px;left:0;right:0;z-index:5;color:var(--muted);text-transform:uppercase;letter-spacing:.18em;font-size:10px}.deck-count{color:#fff;font-weight:900}
.question-layout{display:grid;grid-template-columns:1fr 300px;gap:20px}.question-card{min-height:480px;display:flex;flex-direction:column;justify-content:center}.question-card .q-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.difficulty{color:var(--red3);letter-spacing:.2em;font-size:11px;font-weight:900}.category{border:1px solid #555;padding:7px 9px;font-size:10px;letter-spacing:.08em;text-transform:uppercase}.question-text{font-size:clamp(25px,3.1vw,47px);line-height:1.08;letter-spacing:-.035em;margin:0 0 25px;max-width:1000px}.options{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.option{min-height:72px;text-transform:none;text-align:left;letter-spacing:0;font-size:16px;padding:16px 18px;background:#0a0a0a;border-color:#343434}.option .option-letter{color:var(--red3);font-weight:900;margin-right:9px}.timer-box{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:300px;background:#090909;border:1px solid #36101a}.timer{width:160px;height:160px;border-radius:50%;display:grid;place-items:center;border:6px solid var(--red2);background:conic-gradient(var(--red) var(--progress,100%),#201016 0);position:relative;box-shadow:0 0 30px #d20b2428}.timer:before{content:"";position:absolute;inset:12px;background:#090909;border-radius:50%;border:1px solid #5b111c}.timer strong{z-index:1;font-size:54px;letter-spacing:-.08em}.timer-box p{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:17px 0 0}.timer.warn{animation:pulse .7s infinite}.timer.critical{animation:pulse .28s infinite;border-color:var(--red3)}@keyframes pulse{50%{box-shadow:0 0 42px #d20b2477;transform:scale(1.03)}}
.result{min-height:480px;display:grid;place-items:center;text-align:center}.result h2{font-size:clamp(52px,8vw,116px);margin:0}.result.correct h2{color:#fff}.result.incorrect h2{color:var(--red3);text-shadow:0 0 28px #d20b2477}.delta{font-size:44px;font-weight:900;color:var(--red3);animation:floatUp 1s ease both}.explain{max-width:700px;color:#ddd;font-size:17px;line-height:1.55}.damage-flash{animation:flash .65s ease}@keyframes flash{50%{background:#630918}}@keyframes floatUp{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:none}}
.standings{width:100%;border-collapse:collapse}.standings th,.standings td{text-align:left;border-bottom:1px solid #2c1016;padding:14px 10px}.standings th{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}.standings td{font-size:16px}.standings .num{font-weight:900;font-size:23px}.standings .eliminated{color:var(--red3);text-decoration:line-through}
.conversion{text-align:center;max-width:800px;margin:0 auto}.energy-number{font-size:clamp(42px,7vw,92px);font-weight:900;letter-spacing:-.08em;color:var(--red3);margin:20px 0}
.cinema{display:grid;place-items:center;text-align:center;min-height:100vh;background:#050505;overflow:hidden}.cinema .beat{font-weight:900;font-size:clamp(32px,6vw,90px);max-width:1000px;line-height:.95;letter-spacing:-.06em;text-transform:uppercase;animation:cinemaIn .9s ease both;text-shadow:0 0 30px #d20b2466}.cinema small{display:block;margin-top:35px;color:var(--muted);letter-spacing:.2em;text-transform:uppercase}@keyframes cinemaIn{from{opacity:0;transform:scale(1.1);filter:blur(12px)}to{opacity:1;transform:none;filter:none}}
.arena{min-height:610px;position:relative;border:1px solid #4b111c;background:radial-gradient(circle,#26050b 0,#0b0708 33%,#050505 72%);overflow:hidden}.arena-core{position:absolute;inset:23% 31%;border:1px solid var(--red2);transform:rotate(45deg);box-shadow:0 0 80px #d20b2428,inset 0 0 40px #d20b2419}.arena-core:before,.arena-core:after{content:"";position:absolute;inset:18%;border:1px solid #fff5}.arena-core:after{transform:rotate(45deg)}.arena-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;text-align:center;text-transform:uppercase;letter-spacing:.17em;font-size:10px;color:var(--muted)}.arena-center b{display:block;color:var(--red3);font-size:19px;letter-spacing:.1em;margin-bottom:7px}
.arena-team{position:absolute;width:190px;text-align:center;z-index:4;transition:.3s}.arena-team.north{top:22px;left:50%;transform:translateX(-50%)}.arena-team.east{right:22px;top:50%;transform:translateY(-50%)}.arena-team.south{bottom:22px;left:50%;transform:translateX(-50%)}.arena-team.west{left:22px;top:50%;transform:translateY(-50%)}.arena-team.dead{opacity:.15;filter:grayscale(1)}.arena-team .team-symbol{width:76px;height:76px;margin:0 auto 6px}.arena-team .arena-stat{font-size:11px;color:#ddd;line-height:1.7}.arena-team .arena-stat b{color:#fff}.arena-team.targeted .team-symbol{animation:targetPulse .6s infinite;filter:drop-shadow(0 0 20px var(--red3))}.arena-team.attacked{animation:shake .5s ease}.arena-team h3{font-size:10px;margin:2px 0;color:var(--muted);letter-spacing:.18em}@keyframes targetPulse{50%{transform:scale(1.15)}}@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
.arena-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:15px}.arena-head h2{margin:4px 0}.current-symbol{display:flex;align-items:center;gap:12px}.current-symbol .team-symbol{width:46px;height:46px;margin:0}.current-symbol strong{font-size:19px}
.news{border-left:3px solid var(--red);padding:12px 15px;background:#26070c;margin-bottom:14px}.news small{color:var(--red3);letter-spacing:.15em;text-transform:uppercase;font-weight:900}.news p{margin:6px 0 0;font-size:16px}
.ability-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.ability-card{min-height:145px;text-align:left;display:flex;flex-direction:column;gap:7px;padding:15px;background:#0c0c0c;border-color:#3d111a}.ability-card b{font-size:14px;letter-spacing:.08em}.ability-card .cost{color:var(--red3);font-size:12px;font-weight:900}.ability-card p{color:var(--muted);font-size:12px;line-height:1.4;margin:0}.ability-card .use{margin-top:auto;padding:9px;font-size:9px}
.targets{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.target-card{min-height:210px;display:grid;place-items:center;text-align:center;border:1px solid #43101a;background:#0b0b0b;transition:.2s}.target-card:hover,.target-card.selected{border-color:var(--red3);box-shadow:0 0 28px #d20b243a;transform:translateY(-5px)}.target-card .team-symbol{width:88px;height:88px;margin:0 auto 8px}.target-card h3{font-size:12px;margin:0;color:var(--muted)}.target-card p{font-size:12px;margin:5px 0 0}
.fake-question{max-width:850px;margin:0 auto}.fake-question .question-text{font-size:32px;margin-top:20px}.fake-question .options{grid-template-columns:repeat(4,1fr)}
.narrative{max-width:1050px;margin:0 auto}.narrative-card{padding:25px;border:1px solid #4b111c;background:#0b0b0b;margin:15px 0}.narrative-card p{font-size:24px;line-height:1.3;margin:0 0 15px}.narrative-card .options{grid-template-columns:repeat(4,1fr)}.narrative-card.done{opacity:.45;border-color:#444}
.victory{display:grid;place-items:center;text-align:center;min-height:100vh;position:relative;overflow:hidden}.victory:before{content:"";position:absolute;width:75vw;height:75vw;border:1px solid var(--red);transform:rotate(45deg);box-shadow:0 0 120px #d20b243d}.victory-inner{position:relative;z-index:1}.victory h1{font-size:clamp(55px,10vw,160px);margin-bottom:15px}.winner-symbol{width:130px;height:130px;margin:25px auto}.winner-name{color:var(--red3);font-size:clamp(25px,5vw,58px);font-weight:900;letter-spacing:.12em;text-transform:uppercase}
.toast{position:fixed;right:20px;bottom:20px;z-index:100;background:#18070b;border:1px solid var(--red);padding:14px 18px;max-width:380px;box-shadow:0 10px 35px #000;animation:toastIn .3s ease}.toast b{color:var(--red3);display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:5px}.toast p{margin:0;font-size:13px}.modal-back{position:fixed;inset:0;background:#000c;display:grid;place-items:center;z-index:90;padding:20px}.modal{max-width:500px;width:100%;background:#0b0b0b;border:1px solid var(--red);padding:26px;box-shadow:0 0 60px #000}.modal h3{color:var(--red3);margin-bottom:8px}.modal p{color:#ddd;line-height:1.5}.modal .actions{justify-content:flex-end}@keyframes toastIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.operator{position:fixed;top:0;right:0;width:min(390px,94vw);height:100vh;background:#090909;border-left:1px solid var(--red);z-index:80;padding:24px;overflow:auto;box-shadow:-20px 0 50px #000;animation:drawer .25s ease}.operator h3{color:var(--red3)}.operator label{display:block;color:var(--muted);font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin:12px 0 5px}.operator select,.operator input{width:100%;background:#050505;color:#fff;border:1px solid #444;padding:10px}.operator-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}@keyframes drawer{from{transform:translateX(100%)}to{transform:none}}
@media(max-width:1000px){.name-grid{grid-template-columns:repeat(3,1fr)}.question-layout{grid-template-columns:1fr}.timer-box{min-height:0;padding:18px;flex-direction:row;gap:20px}.timer{width:100px;height:100px}.timer strong{font-size:35px}.ability-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:800px){.card-table{min-height:450px}.card{--rad:140px !important;}}
@media(max-width:680px){.screen{padding:18px 15px 25px}.name-grid,.grid.two,.grid.three,.grid.four{grid-template-columns:1fr}.status-strip{grid-template-columns:repeat(2,1fr)}.options,.fake-question .options,.narrative-card .options{grid-template-columns:1fr}.arena{min-height:500px}.arena-team{width:120px}.arena-team.east{right:2px}.arena-team.west{left:2px}.arena-team .team-symbol{width:54px;height:54px}.arena-team.south{bottom:8px}.arena-team.north{top:8px}.targets{grid-template-columns:1fr}.phase-title,.setup-header,.arena-head{align-items:start;flex-direction:column}.ability-grid{grid-template-columns:1fr 1fr}.ability-card{min-height:165px}}
</style>
</head>
<body>
<div id="app" class="app"></div>
<script>
(() => {
"use strict";
const KEY="persuasion-war-save-v1";
const DIFFICULTIES={Easy:{correct:5,damage:10},Medium:{correct:10,damage:15},Hard:{correct:15,damage:20},Extreme:{correct:25,damage:25}};
const P1_ABILITIES=[
 {id:"attack",name:"Attack",cost:20,desc:"Correct answer deals 20 damage. Wrong answer reflects 20 damage.",effect:"attack"},
 {id:"heavy",name:"Heavy Attack",cost:35,desc:"Correct answer deals 30 damage. Wrong answer reflects 30 damage.",effect:"heavy"},
 {id:"shield",name:"Shield",cost:30,desc:"Blocks the next incoming attack against this team.",effect:"shield"},
 {id:"health",name:"Health",cost:25,desc:"Restore 20 health immediately, capped at 100.",effect:"health"},
 {id:"extra",name:"Extra Time",cost:15,desc:"Adds 15 seconds to a future question timer.",effect:"extra"}
];
const P2_ABILITIES=[
 {id:"censorship",name:"Censorship",cost:2000,desc:"Target a team. They lose their next turn.",effect:"targetSkip"},
 {id:"mirror",name:"Propaganda Mirror",cost:2500,desc:"The next attack against this team reflects back to its attacker.",effect:"mirror"},
 {id:"fake",name:"Fake News",cost:1500,desc:"Target a team. A classification error costs them 20 health.",effect:"fake"},
 {id:"support",name:"Public Support",cost:2000,desc:"Restore 20 health and gain 5 Public Opinion.",effect:"support"},
 {id:"media",name:"Media Shield",cost:2500,desc:"Blocks the next incoming attack against this team.",effect:"media"},
 {id:"strike",name:"Propaganda Strike",cost:3000,desc:"Target one opposing team and deal 25 damage.",effect:"strike"},
 {id:"bomb",name:"Information Bombardment",cost:5000,desc:"Once per game: every other surviving team loses 25 health.",effect:"bomb"}
];
const QUESTIONS=[
 {id:"e1",d:"Easy",cat:"Logos",type:"identification",q:"A poster lists three water-quality measurements beside the claim: “Tested. Proven. Safe.” Which appeal is strongest?",o:["Logos","Pathos","Ethos","Satire"],a:0,x:"The measurements are evidence used to make a logical case: logos.",p:5},
 {id:"e2",d:"Easy",cat:"Pathos",type:"identification",q:"“No child should feel alone at lunch.” Which persuasive appeal is most prominent?",o:["Ethos","Pathos","Logos","Allegory"],a:1,x:"The sentence aims at empathy and concern, so pathos is strongest.",p:5},
 {id:"e3",d:"Easy",cat:"Ethos",type:"identification",q:"“As a nurse with twenty years of experience, I recommend this policy.” What is being established?",o:["Ethos","Bias","Satire","Logos"],a:0,x:"The speaker invokes experience and credibility: ethos.",p:5},
 {id:"e4",d:"Easy",cat:"Fact vs. Opinion",type:"classification",q:"Which statement is an opinion?",o:["The library opens at 8:00.","The library is the finest room in the school.","The library has 12 tables.","The library closes on Friday."],a:1,x:"“Finest” expresses a judgement that can be debated, making it an opinion.",p:5},
 {id:"e5",d:"Easy",cat:"Persuasive Language",type:"effect",q:"What is the likely effect of the word “only” in: “Only careless people ignore this warning”?",o:["It adds a moral judgement.","It supplies a statistic.","It removes all emotion.","It proves the claim."],a:0,x:"“Only” narrows acceptable behaviour and helps shame the audience into agreement.",p:5},
 {id:"e6",d:"Easy",cat:"Bias",type:"identification",q:"A review praises a film but never mentions that the reviewer was paid by the studio. What issue is most evident?",o:["Hidden bias","Neutral perspective","Pure logos","Allegory"],a:0,x:"The undisclosed relationship may influence the review, creating hidden bias.",p:5},
 {id:"e7",d:"Easy",cat:"Propaganda",type:"identification",q:"A campaign poster repeats a short slogan in huge letters and gives no evidence. Which label fits best?",o:["Propaganda technique","Balanced analysis","Primary evidence","Private diary"],a:0,x:"Repetition and emotional simplicity can shape public opinion without offering evidence.",p:5},
 {id:"m1",d:"Medium",cat:"Persuasive Techniques",type:"technique",q:"“Everyone in our neighbourhood is choosing the new service.” Which technique is used, and why might it work?",o:["Bandwagon; it makes belonging feel like proof.","Expert testimony; it proves the service is safe.","Irony; it says the opposite.","Statistics; it gives measurable data."],a:0,x:"Bandwagon suggests that popularity itself is evidence and pressures the audience to join.",p:10},
 {id:"m2",d:"Medium",cat:"Perspective",type:"perspective",q:"A school article calls a timetable change “a bold improvement.” A student article calls it “an exhausting burden.” What matters most when comparing them?",o:["Their perspectives and interests shape the framing.","The longer article must be correct.","The positive phrase is automatically factual.","Neither can contain bias."],a:0,x:"Perspective affects which details and loaded words a writer selects; neither label is automatically fact.",p:10},
 {id:"m3",d:"Medium",cat:"Logos / Pathos",type:"compare",q:"Which sentence combines logos with pathos most effectively?",o:["“The river rose 40cm; families now need safe shelter.”","“I am an expert, therefore agree.”","“Everybody knows this is best.”","“The river is blue.”"],a:0,x:"The measurement supplies logos while the reference to families creates emotional urgency.",p:10},
 {id:"m4",d:"Medium",cat:"Satire",type:"analysis",q:"A mock news report proposes banning umbrellas because rain is inconvenient. The absurdity exposes a real debate about public rules. What is this doing?",o:["Using satire to criticise by exaggeration","Presenting neutral data","Using ethos through expertise","Writing a literal instruction"],a:0,x:"Satire uses humour, absurdity or exaggeration to make readers reconsider a real issue.",p:10},
 {id:"m5",d:"Medium",cat:"Fact vs. Opinion",type:"classification",q:"“The council approved the plan on Tuesday, so it is clearly the wisest plan.” Which reading is best?",o:["The first clause is factual; the second is opinion.","Both clauses are statistics.","The first is satire; the second is ethos.","Both clauses are impossible to check."],a:0,x:"The approval date can be checked. “Wisest” is a judgement, signalled by evaluative language.",p:10},
 {id:"m6",d:"Medium",cat:"Allegory",type:"analysis",q:"In a generic allegory, a locked gate might represent an invisible social barrier. What makes this allegorical rather than simply descriptive?",o:["The concrete image carries a wider abstract meaning.","The gate must be historically real.","The writer must name the abstract idea.","Allegory can only be comic."],a:0,x:"Allegory lets a concrete setting, object or action represent a larger abstract idea.",p:10},
 {id:"m7",d:"Medium",cat:"Effect of Language",type:"effect",q:"Compare “The plan changes the schedule” with “The plan tears apart our day.” What changes?",o:["The second uses a violent metaphor to create alarm.","The second becomes a verified fact.","The first uses stronger pathos.","Nothing; metaphors have no effect."],a:0,x:"“Tears apart” is a violent metaphor that frames an ordinary change as destructive.",p:10},
 {id:"h1",d:"Hard",cat:"Bias",type:"identify-bias",q:"A report describes a protest as “a noisy mob” and never names the protesters’ demands. What is the strongest supported criticism?",o:["Its loaded label and omission frame the group negatively.","It must be accurate because it is short.","It is neutral because “mob” is a noun.","It proves the protest failed."],a:0,x:"The loaded noun and omission of demands guide the audience toward a negative view.",p:15},
 {id:"h2",d:"Hard",cat:"Rhetorical Choice",type:"effect",q:"Why might a charity lead with one person’s story before giving national statistics?",o:["Pathos creates identification, then logos broadens the case.","Statistics can never persuade.","A story automatically proves the policy.","It removes the need for evidence."],a:0,x:"The personal story builds emotional connection; later statistics can add scale and credibility.",p:15},
 {id:"h3",d:"Hard",cat:"Propaganda",type:"analysis",q:"A speech repeats “security” but never defines the threat or the proposed policy. What is the most careful interpretation?",o:["The vague repetition may create urgency while avoiding scrutiny.","The speech contains no persuasive technique.","The policy is certainly safe.","Repetition always makes an argument logical."],a:0,x:"A repeated abstract value can sound reassuring while leaving key claims unexamined; this is a plausible framing concern.",p:15},
 {id:"h4",d:"Hard",cat:"Compare Statements",type:"compare",q:"Statement A: “The survey found 62% support.” Statement B: “The public has spoken.” Which is more defensible and why?",o:["A, because it gives a specific result and can be checked.","B, because broad claims need no context.","A, because all surveys are perfectly reliable.","B, because metaphor is evidence."],a:0,x:"A gives a checkable figure; B generalises from an unspecified public and hides context.",p:15},
 {id:"h5",d:"Hard",cat:"Ethos",type:"analysis",q:"A scientist says, “The evidence is still limited, but the early results are promising.” What is the likely effect of the qualification?",o:["It can strengthen ethos by showing caution and intellectual honesty.","It destroys credibility because experts must sound certain.","It turns the statement into satire.","It proves the results are false."],a:0,x:"Acknowledging limits can make a speaker seem more trustworthy rather than less.",p:15},
 {id:"h6",d:"Hard",cat:"Perspective",type:"compare",q:"Two accounts use the same event but one begins with property damage and the other with injuries. What should a reader ask first?",o:["What does each selection foreground, and what may it leave out?","Which account uses more dramatic punctuation?","Which account is longer, so must be right?","Whether both accounts are fiction."],a:0,x:"Selection and omission shape perspective; foregrounding one consequence can change the narrative.",p:15},
 {id:"h7",d:"Hard",cat:"Technique",type:"analysis",q:"“If you really cared about your neighbours, you would support this proposal.” What is the central persuasive move?",o:["A false moral choice that pressures the audience through guilt.","A neutral definition of caring.","A statistical comparison.","An appeal to expert evidence."],a:0,x:"The sentence links disagreement with moral failure, limiting the audience’s acceptable choices.",p:15},
 {id:"x1",d:"Extreme",cat:"Misleading Framing",type:"multi-layer",q:"A headline says “Crime doubles after the new policy.” The figures are 1 incident before and 2 after, over different time periods. Which criticism is strongest?",o:["The headline is technically based on a ratio but misleading because context and scale are hidden.","The headline is definitely fabricated.","Doubling can never be meaningful.","The policy must have caused both incidents."],a:0,x:"The ratio may be arithmetically true, yet the small numbers and unequal periods make the causal framing misleading.",p:25},
 {id:"x2",d:"Extreme",cat:"Appeals",type:"multi-layer",q:"“Our independent review—funded by the company—shows the product is safe, and thousands of grateful customers agree.” Which analysis is best?",o:["Ethos is claimed, but the funding creates a credibility question; testimonials add pathos rather than proof.","It is pure logos because it says “review.”","Funding guarantees bias, so the product is unsafe.","Customers’ feelings are scientific evidence."],a:0,x:"The review invokes ethos, but funding is relevant context; grateful customers add emotional support, not independent proof.",p:25},
 {id:"x3",d:"Extreme",cat:"Satire",type:"multi-layer",q:"A satirical article praises a fictional leader for “saving time by cancelling every meeting.” What should a reader use to infer the target of criticism?",o:["The gap between exaggerated praise and the policy’s absurd consequence.","Only the article’s final adjective.","The claim that every leader behaves this way.","The fact that satire has no viewpoint."],a:0,x:"Satire often relies on incongruity: enthusiastic praise clashes with an absurd result.",p:25},
 {id:"x4",d:"Extreme",cat:"Allegory",type:"multi-layer",q:"A story about a town where maps are repeatedly redrawn can explore power without naming a real government. What is the strongest reading?",o:["The changing maps may allegorise control of knowledge and boundaries, but context is needed to support that reading.","The maps have one universal meaning in every story.","It is only a geography lesson.","Allegory requires a real historical event."],a:0,x:"The recurring concrete image can suggest abstract power, but interpretation should remain grounded in the story’s details.",p:25},
 {id:"x5",d:"Extreme",cat:"Fact / Opinion / Bias",type:"multi-layer",q:"“The minister’s disastrous plan was announced at 9am; even her own supporters looked worried.” Which answer is most precise?",o:["The time is factual if verified; “disastrous” is opinion, while the supporter claim needs evidence and may frame the minister negatively.","Everything is fact because it sounds like reporting.","Everything is opinion because the sentence has a viewpoint.","The sentence is automatically propaganda."],a:0,x:"Different clauses have different status. Precision means separating checkable detail from judgement and unsupported framing.",p:25},
 {id:"x6",d:"Extreme",cat:"Rhetorical Choice",type:"compare",q:"A campaign uses a calm graph in one speech and a close-up image of a suffering child in another. Which conclusion is best supported?",o:["The campaign adapts appeal and medium: logos may build explanation while pathos intensifies urgency.","The graph is objective and the image is manipulative by definition.","Both choices have exactly the same effect.","Neither can persuade an audience."],a:0,x:"Different rhetorical choices foreground different responses; the image is not automatically invalid, but it intensifies pathos.",p:25},
 {id:"x7",d:"Extreme",cat:"Perspective",type:"multi-layer",q:"A historical account calls a change “a revolution”; a later account calls it “a transfer of authority.” What is the best next step?",o:["Compare evidence, purpose, audience and connotations before deciding which framing is better supported.","Choose the more dramatic phrase.","Assume the later account is neutral.","Treat the two phrases as identical."],a:0,x:"The words carry different connotations. Evaluating framing requires context, evidence, purpose and audience.",p:25}
];
const NEWS=[
 {text:"BREAKING: ONE TEAM COMPLETELY DOMINATED PHASE 1.",kind:"framing"},
 {text:"OPINION: ONE TEAM'S SUCCESS WAS PROBABLY LUCK.",kind:"opinion"},
 {text:"REPORT: A TEAM ENTERED THE ARENA WITH ENERGY CONVERTED FROM POINTS.",kind:"fact"},
 {text:"EXCLUSIVE: THE TEAM WITH THE MOST HEALTH MUST BE THE MOST PERSUASIVE.",kind:"bias"},
 {text:"ANALYSIS: A SURVIVING TEAM HAS LOST HEALTH BUT NOT ITS PUBLIC OPINION.",kind:"fact"},
 {text:"COMMENTARY: ONLY A FOOL WOULD IGNORE THE STRONGEST SYMBOL.",kind:"opinion"}
];
const FAKE_NEWS=[
 {q:"The team lost 20 health, so its argument is worthless.",a:2,x:"This is bias: a health result is used to dismiss an argument rather than assess it."},
 {q:"The arena contains four team symbols.",a:0,x:"This is a fact that can be directly checked in the current arena."},
 {q:"The red symbol is the most intimidating.",a:1,x:"This is an opinion: “most intimidating” is a judgement."},
 {q:"Everyone knows the quiet team is secretly winning.",a:3,x:"This is propaganda-like framing: an unsupported universal claim presents a narrative as obvious."}
];
const NARRATIVE=[
 {q:"A team with 30 health cannot persuade anyone.",a:2,x:"Bias: health and persuasive quality are treated as the same thing without evidence."},
 {q:"The team has 70 Energy remaining.",a:0,x:"Fact: the current scoreboard can verify a numerical resource."},
 {q:"The best team is obviously the one with the largest symbol.",a:1,x:"Opinion: “best” and “obviously” assert judgement, not measurable proof."},
 {q:"Only one story deserves to be heard.",a:3,x:"Misleading propaganda: the absolute framing suppresses competing perspectives."}
];
let state=null, toastTimer=null, timerId=null, cinemaTimer=null, soundOn=false, operatorOpen=false;
const app=document.getElementById("app");
const clone=o=>JSON.parse(JSON.stringify(o));
function blankState(){return {screen:"opening",names:Array(15).fill(""),teams:[],assignment:[],assignIndex:0,namingIndex:0,phase:0,round:1,currentTeam:0,used:[],deck:[],currentQuestion:null,currentCard:null,answer:null,result:null,phase1AbilityMode:null,phase1Target:null,phase1Extra:false,history:[],multiplier:100,newsIndex:0,news:null,p2AbilityMode:null,p2Target:null,p2Pending:null,p2TurnSpent:false,p2TurnComplete:false,narrativeDone:false,narrativeAnswers:[],narrativeIndex:0,finalReward:0,bombUsed:false,victoryTeam:null,animatingCard:null,settings:{sound:true}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function load(){try{const x=localStorage.getItem(KEY);if(x){state=Object.assign(blankState(),JSON.parse(x));return true}}catch(e){}state=blankState();return false}
function snapshot(){state.history=(state.history||[]).slice(-9).concat([clone({...state,history:[]})]);save()}
function undo(){if(!state.history?.length)return notice("UNDO","There is no previous valid state.");const h=state.history.pop();state=Object.assign(blankState(),h);save();render();notice("UNDO","Last action restored.");}
function notice(title,msg){clearTimeout(toastTimer);const el=document.createElement("div");el.className="toast";el.innerHTML="<b>"+esc(title)+"</b><p>"+esc(msg)+"</p>";document.body.appendChild(el);toastTimer=setTimeout(()=>el.remove(),3600)}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function fmt(n){return Number(n||0).toLocaleString()}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function survivors(){return state.teams.filter(t=>!t.eliminated)}
function team(i){return state.teams[i]}
function symbol(type,cls=""){const shapes={
 diamond:'<polygon points="50,4 96,50 50,96 4,50"/>',
 triangle:'<polygon points="50,5 95,90 5,90"/>',
 circle:'<circle cx="50" cy="50" r="44"/>',
 star:'<polygon points="50,5 61,37 95,37 68,57 78,91 50,70 22,91 32,57 5,37 39,37"/>'
};return '<div class="team-symbol '+cls+'"><svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="4">'+shapes[type]+'<path d="'+(type==="circle"?"M25 50h50M50 25v50":"M50 18v64M18 50h64")+'" opacity=".35"/></svg></div>'}
function render(){if(!state)load();clearInterval(timerId);clearTimeout(cinemaTimer);let html="";switch(state.screen){
case"opening":html=opening();break;case"setup":html=setup();break;case"assignment":html=assignment();break;case"naming":html=naming();break;case"p1turn":html=p1turn();break;case"p1shop":html=p1shop();break;case"deck":html=deck();break;case"question":html=question();break;case"result":html=result();break;case"standings":html=standings();break;case"conversion":html=conversion();break;case"transition":html=transition();break;case"arena":html=arena();break;case"p2purchase":html=p2purchase();break;case"p2target":html=p2target();break;case"p2fake":html=p2fake();break;case"p2complete":html=p2complete();break;case"narrative":html=narrative();break;case"victory":html=victory();break;default:state.screen="opening";html=opening()}
 app.innerHTML=html+(operatorOpen?operator():"")+(modalHtml||"");modalHtml="";bind();if(state.screen==="question")startQuestionTimer();if(state.screen==="transition")startCinema();if(state.screen==="assignment")startAssignment();save()}
let modalHtml="";
function opening(){return `<section class="opening"><div class="opening-inner"><div class="eyebrow">A classroom game of narrative control</div><h1>THE<br><span class="muted">PERSUASION</span><br>WAR</h1><div class="tagline">CAN YOU CONTROL THE NARRATIVE?</div><button class="primary" data-action="begin">Enter the war</button><div class="small" style="margin-top:22px">15 players · one screen · no devices required</div></div></section>`}
function mast(phase){return `<div class="mast"><div class="brand">THE <span>PERSUASION WAR</span></div><div class="top-actions"><span class="phase-label">${esc(phase)}</span><button class="ghost" data-action="sound">${soundOn?"SOUND ON":"SOUND OFF"}</button><button class="ghost" data-action="operator">OPERATOR</button></div></div>`}
function setup(){return `<section class="screen"><div class="content">${mast("operator setup")}<div class="setup-header"><div><div class="eyebrow">Name entry · teacher only</div><h2>Identify the players.</h2><p class="muted">Every seat must be named before the draw begins. Names are saved locally as you type.</p></div><div class="count-badge"><strong id="nameCount">${state.names.filter(Boolean).length}</strong> / 15 filled</div></div><div class="panel"><div class="name-grid">${state.names.map((n,i)=>`<label class="name-field"><span class="name-no">${String(i+1).padStart(2,"0")}</span><input data-name="${i}" value="${esc(n)}" placeholder="Student ${i+1}" maxlength="30"></label>`).join("")}</div><div id="setupNotice" class="notice"></div><div class="actions"><div class="small">Names persist through refresh. Duplicate names are allowed only after a warning.</div><span class="spacer"></span><button class="primary" data-action="startSetup" ${state.names.filter(Boolean).length<15?"disabled":""}>Start constrained draw</button></div></div></div></section>`}
function assignment(){const done=state.assignIndex>=15;return `<section class="screen"><div class="content">${mast("constrained draw")}<div class="eyebrow">Random assignment · enforced 4 / 4 / 4 / 3</div><div class="assign-stage panel"><div class="assign-name">${done?"DRAW COMPLETE":esc(state.assignment[state.assignIndex]||"Preparing...")}</div><div class="assign-sub">${done?"All 15 players placed":"Assigning player "+(state.assignIndex+1)+" of 15"}</div>${done?`<div class="team-roster">${state.teams.map((t,i)=>`<div class="team-tile">${symbol(t.symbol)}<h3>Team ${i+1}</h3><div class="members">${t.members.map(esc).join("<br>")}</div></div>`).join("")}</div><button class="primary" data-action="toNaming" style="margin-top:28px">Name the teams</button>`:"<div class=\"small\">The table will not accept an invalid roster.</div>"}</div></div></section>`}
function naming(){const t=state.teams[state.namingIndex];return `<section class="screen"><div class="content">${mast("team identity")}<div class="team-naming panel">${symbol(t.symbol)}<div class="eyebrow">Team ${state.namingIndex+1} of 4 · your members</div><h2>Name your faction.</h2><div class="members" style="margin-bottom:22px">${t.members.map(esc).join(" · ")}</div><input class="big-input" id="teamName" maxlength="28" value="${esc(t.name||"")}" placeholder="Enter a team name"><div id="teamNotice" class="notice"></div><button class="primary" data-action="saveTeamName">${state.namingIndex===3?"Enter Phase 1":"Continue"}</button></div></div></section>`}
function p1Header(){const t=team(state.currentTeam);return `${mast("phase 1 · the card war")}<div class="phase-title"><div><div class="eyebrow">Phase 1 / Card War · round ${state.round}</div><h2>Make the room believe you.</h2></div><div class="team-meta">${symbol(t.symbol)}<div><strong>${esc(t.name)}</strong><div class="small">team turn</div></div></div></div>`}
function teamStatus(t){return `<div class="status-strip"><div class="stat"><label>Health</label><strong>${t.health}</strong><div class="healthbar"><i style="width:${t.health}%"></i></div></div><div class="stat"><label>Phase 1 points</label><strong>${fmt(t.points)}</strong></div><div class="stat"><label>Stored abilities</label><strong>${t.inventory.length}</strong><div class="ability-row">${t.inventory.map(x=>`<span class="pill ${x==="shield" || x==="mirror"?"red":""}">${esc(abilityName(x))}</span>`).join("")||'<span class="small">none</span>'}</div></div><div class="stat"><label>Status</label><strong>${t.eliminated?"OUT":"ALIVE"}</strong><div class="small">${t.shield?"SHIELD ARMED · ":""}${t.extraTime?"EXTRA TIME READY":""}</div></div></div>`}
function p1turn(){const t=team(state.currentTeam);return `<section class="screen"><div class="content">${p1Header()}${teamStatus(t)}<div class="turn-callout"><div class="eyebrow">Team ${esc(t.name)}</div><h2>Your turn.</h2><p>Choose whether to visit the shop. Your stored abilities remain separate from this decision.</p></div><div class="grid two"><div class="panel"><div class="eyebrow">Next move</div><h3>Control your resources.</h3><p class="muted">Spend points on abilities now, or go straight to the deck. Purchased cards are stored and must be activated deliberately.</p><div class="actions"><button class="primary" data-action="p1Shop">Open shop</button><button data-action="toDeck">Skip shop</button></div></div><div class="panel"><div class="eyebrow">Ability deck</div><h3>${t.inventory.length} stored card${t.inventory.length===1?"":"s"}</h3><p class="muted">Use Health, Shield or Extra Time now. Attack cards open a target-and-question sequence.</p><button data-action="openAbilityDeck" ${!t.inventory.length?"disabled":""}>Open ability deck</button></div></div></div></section>`}
function abilityName(id){return [...P1_ABILITIES,...P2_ABILITIES].find(a=>a.id===id)?.name||id}
function p1shop(){const t=team(state.currentTeam);return `<section class="screen"><div class="content">${p1Header()}${teamStatus(t)}<div class="panel"><div class="phase-title"><div><div class="eyebrow">Phase 1 shop</div><h2>Buy. Store. Decide later.</h2></div><div class="count-badge">Available <strong>${fmt(t.points)}</strong> pts</div></div><div class="ability-grid">${P1_ABILITIES.map(a=>`<div class="ability-card"><b>${a.name}</b><span class="cost">${a.cost} POINTS</span><p>${a.desc}</p><button class="use" data-action="buyP1" data-id="${a.id}" ${t.points<a.cost?"disabled":""}>Purchase + store</button></div>`).join("")}</div><div class="rule"></div><div class="actions"><button data-action="toDeck">Continue to card deck</button><button class="ghost" data-action="p1turn">Back</button></div></div></div></section>`}

function startQuestionTimer(){clearInterval(timerId);timerId=setInterval(()=>{if(state.screen!=="question"){clearInterval(timerId);return}const remain=Math.max(0,Math.ceil((state.timerEnd-Date.now())/1000)),el=document.getElementById("timer"),num=document.getElementById("timerNum");if(!el||!num)return;num.textContent=remain;el.style.setProperty("--progress",Math.max(0,remain/state.timerBase*100)+"%");el.classList.toggle("warn",remain<=10&&remain>5);el.classList.toggle("critical",remain<=5);if(remain<=0){clearInterval(timerId);resolveAnswer(-1,true)}},200)}
function resolveAnswer(index,timeout=false){if(state.screen!=="question")return;clearInterval(timerId);snapshot();const q=state.currentQuestion,t=team(state.currentTeam),correct=!timeout&&index===q.a;let delta,kind="points",explanation=q.x;if(state.phase1AbilityMode){const mode=state.phase1AbilityMode,target=state.phase1Target;state.phase1AbilityMode=null;state.phase1Target=null;if(correct){delta=mode==="heavy"?30:20;const hit=damage(target,delta);kind="health";explanation=hit.blocked?"The target's shield absorbed the attack. "+q.x:q.x+" The target loses "+delta+" health."}else{delta=mode==="heavy"?30:20;const hit=damage(state.currentTeam,delta);kind="health";explanation=timeout?"The timer expired, so the attack reflected onto the attacker.":q.x+" The attack reflects onto the attacker.";if(hit.eliminated)explanation+=" The attacker is eliminated."}state.result={correct,delta:-delta,kind,explanation,timeout};}else if(correct){t.points+=q.p;state.result={correct:true,delta:q.p,kind:"points",explanation:q.x}}else{const hit=damage(state.currentTeam,DIFFICULTIES[q.d].damage);state.result={correct:false,delta:-DIFFICULTIES[q.d].damage,kind:"health",explanation:q.x+(hit.eliminated?" The team is eliminated.":""),timeout}}state.screen="result";render()}

function convert(){const v=Number(document.getElementById("multiplier").value);if(!Number.isFinite(v)||v<1)return notice("INVALID MULTIPLIER","Use a whole number of at least 1.");snapshot();state.multiplier=Math.round(v);state.teams.forEach(t=>t.energy=t.points*state.multiplier);state.screen="transition";render()}
function buyP2(id){const t=team(state.currentTeam),a=P2_ABILITIES.find(x=>x.id===id);if(state.p2TurnSpent)return notice("TURN LOCKED","This turn already has its one purchase and one use.");if(!a||t.energy<a.cost||(id==="bomb"&&state.bombUsed))return notice("PURCHASE BLOCKED","Insufficient energy or this ultimate is already gone.");snapshot();t.energy-=a.cost;state.p2AbilityMode=id;state.p2TurnSpent=true;state.p2Target=null;if(id==="bomb"){state.bombUsed=true;executeBomb();return}if(["censorship","fake","strike"].includes(id)){state.screen="p2target";render();return}if(id==="mirror"){t.mirror=true;completeP2(true,"MIRROR ARMED","The next attack against this symbol will reflect to its attacker.");return}if(id==="media"){t.mediaShield=true;completeP2(true,"MEDIA SHIELD ARMED","The next incoming attack against this symbol is blocked.");return}if(id==="support"){t.health=Math.min(100,t.health+20);t.opinion=Math.min(100,t.opinion+5);completeP2(true,"PUBLIC SUPPORT","20 health restored. Public Opinion rises by 5.");return}}
function p2Attack(attacker,target,amount){const defender=team(target);if(defender.mirror){defender.mirror=false;const reflected=damage(attacker,amount);return {reflected:true,blocked:reflected.blocked,eliminated:reflected.eliminated}}return damage(target,amount)}
function confirmTarget(){if(state.p2Target===null||state.p2Target===undefined)return;const id=state.p2AbilityMode;if(id==="fake"){state.fakeQuestion=FAKE_NEWS[(state.newsIndex+state.currentTeam)%FAKE_NEWS.length];state.screen="p2fake";render()}else if(id==="strike"){const hit=p2Attack(state.currentTeam,state.p2Target,25);team(state.currentTeam).opinion=Math.min(100,team(state.currentTeam).opinion+3);completeP2(!hit.blocked,"PROPAGANDA STRIKE",hit.reflected?"The target's Propaganda Mirror reflected the 25 damage to the attacker.":hit.blocked?"The target's shield absorbed the 25 damage.":"The target takes exactly 25 damage.");}else if(id==="censorship"){team(state.p2Target).skipNextTurn=true;team(state.currentTeam).opinion=Math.min(100,team(state.currentTeam).opinion+2);completeP2(true,"CENSORSHIP DEPLOYED","The target's next surviving turn is skipped exactly once.");}}
function executeBomb(){const attacker=state.currentTeam,hit=[];state.teams.forEach((t,i)=>{if(i!==attacker&&!t.eliminated){t.health=Math.max(0,t.health-25);if(eliminateCheck(i))hit.push(i)}});team(attacker).opinion=Math.min(100,team(attacker).opinion+8);completeP2(true,"INFORMATION BOMBARDMENT","Every surviving enemy was hit simultaneously for exactly 25 damage. "+(hit.length?hit.length+" elimination"+(hit.length===1?"":"s")+" resolved.":"The attacker was untouched."),true)}
function fakeAnswer(i){const f=state.fakeQuestion,t=team(state.p2Target);const correct=i===f.a;if(correct){t.opinion=Math.max(0,t.opinion-2);completeP2(true,"FRAME RESISTED","The target classified the statement correctly. Public Opinion shifts by -2.");}else{const hit=damage(state.p2Target,20);t.opinion=Math.max(0,t.opinion-5);completeP2(false,"FAKE NEWS LANDED",hit.blocked?"The target's shield blocked the 20 damage.":"Wrong classification: the target loses exactly 20 health and 5 Public Opinion.");}}
function completeP2(success,headline,text){state.p2Pending={success,headline,text};state.p2AbilityMode=null;state.p2Target=null;state.screen="p2complete";render()}
function nextP2(){const alive=survivors();if(alive.length===1){state.victoryTeam=state.teams.findIndex(t=>!t.eliminated);state.screen="victory";render();return}if(alive.length===0){state.victoryTeam=state.currentTeam;state.screen="victory";render();return}if(!state.narrativeDone&&alive.length<=2){state.narrativeIndex=0;state.screen="narrative";render();return}state.currentTeam=nextAlive();state.newsIndex=(state.newsIndex+1)%NEWS.length;state.news=NEWS[state.newsIndex];state.p2TurnSpent=false;state.screen="arena";render()}
function narrativeAnswer(i){const n=NARRATIVE[state.narrativeIndex];if(i===n.a){team(state.currentTeam).opinion=Math.min(100,team(state.currentTeam).opinion+5);state.finalReward+=5;notice("NARRATIVE READ","Correct. +5 Public Opinion.");}else notice("NARRATIVE READ","The frame was misclassified.");state.narrativeIndex++;if(state.narrativeIndex>=NARRATIVE.length){state.narrativeDone=true;state.currentTeam=nextAlive();state.newsIndex=(state.newsIndex+1)%NEWS.length;state.news=NEWS[state.newsIndex];state.p2TurnSpent=false;state.screen="arena"}render()}
function restart(){modalHtml=`<div class="modal-back"><div class="modal"><h3>Restart game?</h3><p>Are you sure? All current game progress will be lost.</p><div class="actions"><button class="ghost" data-action="closeModal">Cancel</button><button class="danger" data-action="confirmRestart">Yes, wipe progress</button></div></div></div>`;render()}
function doRestart(){localStorage.removeItem(KEY);operatorOpen=false;state=blankState();render()}

function bind(){
  document.querySelectorAll("[data-action]").forEach(el=>el.addEventListener("click",e=>{
    const a=el.dataset.action;
    if(a==="begin")begin();
    else if(a==="sound"){soundOn=!soundOn;state.settings.sound=soundOn;render()}
    else if(a==="operator"){operatorOpen=!operatorOpen;render()}
    else if(a==="startSetup")startSetup();
    else if(a==="toNaming"){state.screen="naming";render()}
    else if(a==="saveTeamName")saveTeamName();
    else if(a==="p1Shop")state.screen="p1shop",render();
    else if(a==="toDeck")state.screen="deck",render();
    else if(a==="p1turn")state.screen="p1turn",render();
    else if(a==="buyP1")buyP1(el.dataset.id);
    else if(a==="openAbilityDeck")openAbilityDeck();
    else if(a==="useP1")useP1(Number(el.dataset.index));
    else if(a==="closeModal"){modalHtml="";render()}
    else if(a==="p1Target"){state.phase1Target=Number(el.dataset.index);const t=team(state.phase1Target);modalHtml=`<div class="modal-back"><div class="modal"><div class="eyebrow">Target confirmed</div><h3>${esc(t.name)}</h3><p>Draw a question. A correct answer deals damage; an incorrect answer reflects damage onto your team.</p><div class="actions"><button class="primary" data-action="attackDraw">Draw attack question</button><button class="ghost" data-action="closeModal">Cancel</button></div></div></div>`;render()}
    else if(a==="attackDraw"){modalHtml="";startQuestion(state.deck[0])}
    else if(a==="pickCard"){startQuestion(el.dataset.id)}
    else if(a==="selectCard"){selectCard(el.dataset.id)}
    else if(a==="answer")resolveAnswer(Number(el.dataset.answer));
    else if(a==="teacherCorrect")resolveAnswer(state.currentQuestion.a);
    else if(a==="teacherWrong")resolveAnswer((state.currentQuestion.a+1)%state.currentQuestion.o.length);
    else if(a==="nextAfterResult")nextResult();
    else if(a==="toConversion")state.screen="conversion",render();
    else if(a==="convert")convert();
    else if(a==="skipCinema")toArena();
    else if(a==="arena")state.screen="arena",render();
    else if(a==="openP2Purchase")state.screen="p2purchase",render();
    else if(a==="buyP2")buyP2(el.dataset.id);
    else if(a==="selectTarget"){state.p2Target=Number(el.dataset.index);render()}
    else if(a==="confirmTarget")confirmTarget();
    else if(a==="fakeAnswer")fakeAnswer(Number(el.dataset.answer));
    else if(a==="nextP2")nextP2();
    else if(a==="narrativeAnswer")narrativeAnswer(Number(el.dataset.answer));
    else if(a==="restart")restart();
    else if(a==="confirmRestart")doRestart();
    else if(a==="undo")undo();
    else if(a==="adjustTeam"){
      const idx=Number(document.getElementById("opTeam")?.value);
      const h=Number(document.getElementById("opHealth")?.value);
      const p=Number(document.getElementById("opPoints")?.value);
      const en=Number(document.getElementById("opEnergy")?.value);
      if(!isNaN(idx)&&state.teams[idx]){
        if(!isNaN(h)&&h!=="")state.teams[idx].health=Math.min(100,Math.max(0,h));
        if(!isNaN(p)&&p!=="")state.teams[idx].points=Math.max(0,p);
        if(!isNaN(en)&&en!=="")state.teams[idx].energy=Math.max(0,en);
        save();
        notice("OPERATOR","Team stats adjusted.");
        render();
      }
    }
    else if(a==="skipTurn"){
      if(state.phase===1)nextResult();
      else if(state.phase===2)nextP2();
    }
    else if(a==="eliminate"){
      const idx=Number(document.getElementById("opTeam")?.value);
      if(!isNaN(idx)&&state.teams[idx]){
        state.teams[idx].health=0;
        state.teams[idx].eliminated=true;
        save();
        notice("OPERATOR","Team eliminated.");
        render();
      }
    }
    else if(a==="skipQuestion")resolveAnswer(-1,true);
  }));

  document.querySelectorAll("[data-name]").forEach(input=>{
    input.addEventListener("input",e=>{
      const idx=Number(input.dataset.name);
      state.names[idx]=input.value;
      const countEl=document.getElementById("nameCount");
      if(countEl)countEl.textContent=state.names.filter(Boolean).length;
      const btn=document.querySelector('[data-action="startSetup"]');
      if(btn)btn.disabled=state.names.filter(Boolean).length<15;
      save();
    });
  });

  const teamNameEl=document.getElementById("teamName");
  if(teamNameEl){
    teamNameEl.addEventListener("keydown",e=>{if(e.key==="Enter")saveTeamName()});
  }
}

if(document.readyState==="loading"){
  document.addEventListener("DOMContentLoaded",()=>{load();render();});
}else{
  load();
  render();
}
})();
</script>
</body>
</html>
